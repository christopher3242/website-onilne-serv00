<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jigsaw Puzzle with Fixed Exit</title>
  <style>
    /* Reset box model */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2em;
      color: #333;
    }

    /* Container styles */
    .controls {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Puzzle container styles for responsiveness and aesthetics */
    .puzzle-container {
      width: 100%;
      margin: 0 auto;
    }

    /* Style for each iframe to ensure responsiveness */
    iframe {
      width: 100%;
      height: 600px;
      min-height: 300px;
      border: 2px solid #888;
      border-radius: 8px;
      display: block;
      margin-bottom: 20px;
    }

    /* Adjust height on smaller screens */
    @media(max-width: 768px) {
      iframe {
        height: 50vh;
      }
    }

    /* Fixed Exit Button styling for PC & Android */
    .exit-fixed {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }

    /* Style link as button for accessibility & UX */
    .exit-fixed a {
      background-color: #007bff;
      color: #fff;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: background-color 0.3s, transform 0.2s;
    }

    /* Hover effects for the button */
    .exit-fixed a:hover {
      background-color: #0056b3;
      transform: translateY(-2px);
    }

    /* Smaller screen adjustments for the button */
    @media(max-width: 480px) {
      .exit-fixed a {
        padding: 10px 20px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <h1>Jigsaw Puzzle</h1>
  <div class="controls">
    <div class="puzzle-container" id="puzzleContainer">
      <!-- First iframe source -->
      <iframe
        allowfullscreen="true"
        src="https://www.jigsawexplorer.com/online-jigsaw-puzzle-player.html?url=aHR0cHM6Ly9pLmltZ3VyLmNvbS9keFdMZXRzLnBuZ18obm9fcHJldmlld180KV8obm9wPTMwKQ~~&cred=TG9jayBhbmQgY2l0eSwgMjAyNiAtIMKpQ2hyaXN0b3BoZXIgY2FtaWxsZXJpIA~~&color=gray"
        title="Jigsaw Puzzle"
        style="width: 100%; height: 600px; border: 2px solid #888; border-radius: 8px;"
      ></iframe>
      
      <!-- Second iframe source -->
      <iframe
        src="https://www.jigsawplanet.com/?rc=play&pid=271232264124&view=iframe&bgcolor=0x70799e"
        style="width: 100%; height: 600px; border: 2px solid #888; border-radius: 8px;"
        frameborder="0"
        allowfullscreen
        title="Jigsaw Puzzle"
      ></iframe>
    </div>
  </div>
  
  <!-- Fixed Exit Button -->
  <div class="exit-fixed">
    <a href="../Games.html">Exit</a>
  </div>
</body>
</html>
