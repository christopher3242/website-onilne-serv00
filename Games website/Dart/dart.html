<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Darts Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 2em;
    }
    /* Mode switch buttons */
    .mode-switch-container {
      text-align: center;
      margin-bottom: 10px;
    }
    .mode-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background-color: #6c757d;
      color: white;
      margin: 0 5px;
      transition: background-color 0.2s;
    }
    .mode-btn.active {
      background-color: #007bff;
    }
    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      transition: background-color 0.3s;
      flex: 1 1 120px;
      min-width: 120px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .player-list {
      max-width: 400px;
      margin: 0 auto 30px;
      padding: 15px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .player-list h2 {
      margin-top: 0;
      text-align: center;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      padding: 8px 12px;
      margin: 4px 0;
      background-color: #e9ecef;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score {
      font-weight: bold;
    }
    /* Darts number grid */
    .dart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
      gap: 8px;
      max-width: 600px;
      margin: 0 auto 30px;
    }
    .dart-cell {
      padding: 10px;
      background-color: #fff;
      border-radius: 4px;
      border: 1px solid #ccc;
      text-align: center;
      font-weight: bold;
      font-size: 1em;
      user-select: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .dart-cell:hover {
      background-color: #e0e0e0;
      transform: scale(1.05);
    }
    /* Segment control for single/double/triple */
    .segment-controls {
      max-width: 600px;
      margin: 0 auto 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .segment-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      background-color: #28a745;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s, border 0.2s;
      flex: 1 1 100px;
      min-width: 100px;
    }
    .segment-btn:hover,
    .segment-btn.selected {
      background-color: #1e7e34;
      border: 2px solid #000;
    }
    /* Throw button style */
    #throwBtn {
      display: block;
      margin: 0 auto 30px;
      padding: 14px 28px;
      font-size: 1.2em;
      background-color: #ffc107;
      color: #000;
      border-radius: 5px;
      cursor: pointer;
      border: none;
      transition: background-color 0.3s;
    }
    #throwBtn:hover {
      background-color: #e0a800;
    }
    /* Mode indicator & turn indicator */
    #modeIndicator, #playerTurn {
      text-align: center;
      margin-bottom: 10px;
      font-weight: bold;
    }
    /* Responsive adjustments */
    @media(max-width: 768px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      button {
        flex: 1 1 auto;
      }
      .segment-controls {
        flex-direction: column;
      }
      .segment-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>The Darts Game</h1>
  </header>
  <!-- Mode switch list -->
  <div class="mode-switch-container">
    <button id="modePvP" class="mode-btn active">Player vs Player</button>
    <button id="modePvCPU" class="mode-btn">Player vs CPU</button>
  </div>
  
  <!-- Game controls -->
  <div class="controls">
    <a href="../Games.html"><button id="exitBtn">Exit</button></a>
    <button id="restartBtn">Restart</button>
  </div>
  
  <div id="modeIndicator">Mode: Player vs Player</div>
  <div id="playerTurn">Current Turn: Player 1</div>
  
  <div class="player-list">
    <h2>Players</h2>
    <ul>
      <li><span class="name">Player 1</span> <span class="score" id="score1">501</span></li>
      <li><span class="name">Player 2</span> <span class="score" id="score2">501</span></li>
    </ul>
  </div>
  
  <h2 style="text-align:center;">Select Number</h2>
  <div class="dart-grid" id="dartGrid"></div>
  
  <h2 style="text-align:center;">Select Segment</h2>
  <div class="segment-controls">
    <button class="segment-btn" data-multiplier="1">Single</button>
    <button class="segment-btn" data-multiplier="2">Double</button>
    <button class="segment-btn" data-multiplier="3">Triple</button>
  </div>
  
  <button id="throwBtn">Throw Dart</button>

  <script>
    // Generate dart numbers grid
    const dartGrid = document.getElementById('dartGrid');
    for (let i = 1; i <= 50; i++) {
      const cell = document.createElement('div');
      cell.className = 'dart-cell';
      cell.textContent = i;
      cell.dataset.number = i;
      dartGrid.appendChild(cell);
    }

    // State variables
    let selectedNumber = null;
    let selectedMultiplier = 1;
    let currentPlayer = 1; // 1 or 2
    let isVsCpu = false; // Mode flag
    let gameOver = false;
    let isProcessingAI = false;

    const score1El = document.getElementById('score1');
    const score2El = document.getElementById('score2');
    const modeIndicator = document.getElementById('modeIndicator');
    const playerTurnEl = document.getElementById('playerTurn');

    // Mode switch button references
    const modePvPBtn = document.getElementById('modePvP');
    const modePvCPUBtn = document.getElementById('modePvCPU');

    // Set game mode function
    function setGameMode(vsCpu) {
      isVsCpu = vsCpu;
      modeIndicator.textContent = `Mode: ${vsCpu ? 'Player vs CPU' : 'Player vs Player'}`;
      
      // Update button styles
      if (vsCpu) {
        modePvCPUBtn.classList.add('active');
        modePvPBtn.classList.remove('active');
      } else {
        modePvPBtn.classList.add('active');
        modePvCPUBtn.classList.remove('active');
      }

      resetGame();
      currentPlayer = 1;
      updatePlayerTurn();
    }

    // Attach event listeners for mode buttons
    document.getElementById('modePvP').addEventListener('click', () => setGameMode(false));
    document.getElementById('modePvCPU').addEventListener('click', () => setGameMode(true));

    // Initialize default mode
    setGameMode(false);

    // Helper functions
    function updatePlayerTurn() {
      if (gameOver) {
        playerTurnEl.textContent = 'Game Over';
        return;
      }
      playerTurnEl.textContent = `Current Turn: Player ${currentPlayer}`;
      highlightCurrentPlayer();
    }

    function highlightCurrentPlayer() {
      document.querySelectorAll('.player-list li').forEach((li, index) => {
        li.style.backgroundColor = (index + 1) === currentPlayer ? '#d4edda' : '';
      });
    }

    function resetGame() {
      score1El.textContent = '501';
      score2El.textContent = '501';
      selectedNumber = null;
      selectedMultiplier = 1;
      gameOver = false;
      isProcessingAI = false;
      // Clear selection highlights
      Array.from(dartGrid.children).forEach(c => c.style.backgroundColor = '');
      // Reset segment buttons
      document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('selected'));
      // Default segment
      if (document.querySelector('.segment-btn')) {
        document.querySelector('.segment-btn').classList.add('selected');
        selectedMultiplier = 1;
      }
    }

    // Event: Select number
    dartGrid.addEventListener('click', (e) => {
      if (gameOver || isProcessingAI) return;
      if (e.target.classList.contains('dart-cell')) {
        Array.from(dartGrid.children).forEach(c => c.style.backgroundColor = '');
        e.target.style.backgroundColor = '#ffc107';
        selectedNumber = parseInt(e.target.dataset.number);
      }
    });

    // Event: Segment buttons
    document.querySelectorAll('.segment-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedMultiplier = parseInt(btn.dataset.multiplier);
        document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });
    // Default segment button
    document.querySelector('.segment-btn').classList.add('selected');

    // Mode switch buttons
    document.getElementById('modePvP').addEventListener('click', () => setGameMode(false));
    document.getElementById('modePvCPU').addEventListener('click', () => setGameMode(true));

    // Restart game
    document.getElementById('restartBtn').addEventListener('click', () => {
      if (confirm('Restart game?')) {
        resetGame();
      }
    });

    // Switch player
    function switchPlayer() {
      currentPlayer = currentPlayer === 1 ? 2 : 1;
      updatePlayerTurn();
    }

    // Handle throw
    document.getElementById('throwBtn').addEventListener('click', () => {
      if (gameOver || isProcessingAI) return;
      if (selectedNumber === null) {
        alert('Please select a number.');
        return;
      }
      processThrow();
    });

    function processThrow() {
      const deduction = selectedNumber * selectedMultiplier;
      const currentScore = scores[currentPlayer]();

      if (currentScore - deduction < 0) {
        alert('Bust! Score cannot go below zero.');
        clearSelection();
        switchPlayer();
        if (isVsCpu && currentPlayer === 2 && !gameOver) {
          setTimeout(aiTurn, 500);
        }
        return;
      }

      if (currentScore - deduction === 0) {
        scores.set(currentPlayer, 0);
        alert(`Player ${currentPlayer} wins!`);
        gameOver = true;
        updatePlayerTurn();
        return;
      }

      // Valid move
      scores.set(currentPlayer, currentScore - deduction);
      clearSelection();
      if (!gameOver) {
        switchPlayer();
      }

      if (isVsCpu && currentPlayer === 2 && !gameOver) {
        setTimeout(aiTurn, 500);
      }
    }

    function clearSelection() {
      Array.from(dartGrid.children).forEach(c => c.style.backgroundColor = '');
      selectedNumber = null;
    }

    // AI turn
    function aiTurn() {
      if (gameOver) return;
      isProcessingAI = true;

      // AI randomly chooses among available numbers
      const availableNumbers = Array.from(dartGrid.children).map(c => parseInt(c.dataset.number));
      const randomNumber = availableNumbers[Math.floor(Math.random() * availableNumbers.length)];

      // Random segment
      const segments = [1, 2, 3];
      const randomSegment = segments[Math.floor(Math.random() * segments.length)];

      // Highlight AI choice
      const cell = Array.from(dartGrid.children).find(c => parseInt(c.dataset.number) === randomNumber);
      Array.from(dartGrid.children).forEach(c => c.style.backgroundColor = '');
      if (cell) {
        cell.style.backgroundColor = '#ffc107';
      }

      // Set selected
      selectedNumber = randomNumber;
      selectedMultiplier = randomSegment;

      // Process AI move after short delay
      setTimeout(() => {
        processThrow();
        isProcessingAI = false;
      }, 300);
    }

    // Initialize scores and variables
    const scores = {
      1: () => parseInt(score1El.textContent),
      2: () => parseInt(score2El.textContent),
      set: (player, value) => {
        if (player === 1) score1El.textContent = value;
        else score2El.textContent = value;
      }
    };

    // Update score setter
    scores.set = (player, value) => {
      if (player === 1) score1El.textContent = value;
      else score2El.textContent = value;
    };
  </script>
</body>
</html>
