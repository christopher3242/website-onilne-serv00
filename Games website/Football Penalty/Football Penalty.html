<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Penalty Shootout</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    padding: 24px 16px;
    font-family: Inter, Arial, sans-serif;
    color: #f8fafc;
    text-align: center;
    background: radial-gradient(circle at top, #243b67 0, #101827 45%, #070b13 100%);
  }
  .app { width: min(720px, 100%); margin: auto; }
  h1 { margin: 4px 0 6px; font-size: clamp(1.8rem, 5vw, 2.8rem); }
  .subtitle { margin: 0 0 10px; color: #a9b8d0; }
  .exit-link {
    display: inline-block;
    margin-bottom: 20px;
    color: #70e1a1;
    font-weight: 700;
    text-decoration: none;
    transition: color .2s, transform .2s;
  }
  .exit-link:hover, .exit-link:focus-visible {
    color: #b8ffd3;
    transform: translateX(-3px);
    outline: none;
    text-decoration: underline;
  }
  .panel {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 10px 16px; padding: 14px; border: 1px solid #334766;
    border-radius: 18px; background: rgba(16, 27, 46, .78); box-shadow: 0 14px 35px #0004;
  }
  .scoreboard { display: flex; justify-content: center; gap: 22px; margin: 18px 0; }
  .stat { min-width: 105px; padding: 10px 16px; border-radius: 14px; background: #172943; }
  .stat strong { display: block; font-size: 1.6rem; color: #70e1a1; }
  label { color: #b9c7dc; font-size: .9rem; }
  select, button, input[type="range"] {
    border: 1px solid #385274; border-radius: 10px; padding: 10px 14px;
    color: #f8fafc; background: #203653; font: inherit; cursor: pointer;
  }
  input[type="range"] { width: 150px; padding: 6px 8px; accent-color: #70e1a1; }
  .volume-control { display: inline-flex; align-items: center; gap: 6px; }
  .volume-control output { min-width: 42px; color: #70e1a1; font-weight: 700; }
  button { border: 0; font-weight: 700; background: linear-gradient(135deg, #15a56a, #087f63); transition: transform .2s, filter .2s; }
  button:hover, button:focus-visible { filter: brightness(1.15); transform: translateY(-2px); outline: 2px solid #70e1a1; outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  #gameCanvas { display: block; width: min(100%, 520px); height: auto; margin: 20px auto 12px; border: 3px solid #6b7d9a; border-radius: 18px; background: #8bd3a9; box-shadow: 0 18px 40px #0006; }
  #status { min-height: 24px; margin: 8px 0 16px; color: #d9e5f7; font-weight: 700; }
  .actions, .keeper-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .actions button { min-width: 130px; }
  .keeper-actions { margin-top: 12px; }
  .keeper-actions button { background: #385274; font-size: .9rem; }
  .secondary { margin-top: 18px; }
  .secondary button { background: #334155; }
  .hidden { display: none !important; }
  @media (max-width: 480px) {
    body { padding: 16px 10px; }
    .panel { align-items: stretch; }
    .panel label, .panel select { width: 100%; }
    .scoreboard { gap: 8px; }
    .stat { min-width: 90px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <h1>Penalty Shootout</h1>
  <p class="subtitle">Aim for the corners and beat the goalkeeper.</p>
  <a href="../Games.html" class="exit-link">← Back to Games</a>

  <section class="panel" aria-label="Game settings">
    <label for="mode">Mode</label>
    <select id="mode">
      <option value="single">Single Player</option>
      <option value="two">Two Player</option>
    </select>
    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="normal" selected>Normal</option>
      <option value="hard">Hard</option>
    </select>
    <label class="volume-control" for="volume">Volume <output id="volumeValue">70%</output></label>
    <input id="volume" type="range" min="1" max="100" value="70" aria-label="Sound volume" />
  </section>

  <section class="scoreboard" aria-label="Scoreboard">
    <div class="stat"><span>Score</span><strong id="score">0</strong></div>
    <div class="stat"><span>Shots</span><strong id="shots">0</strong></div>
    <div class="stat"><span>Turn</span><strong id="turn">1</strong></div>
  </section>

  <div id="status" role="status" aria-live="polite">Choose a direction to shoot.</div>
  <canvas id="gameCanvas" width="520" height="360" aria-label="Penalty shootout game"></canvas>

  <div class="actions" aria-label="Shooting controls">
    <button data-direction="left">Shoot Left</button>
    <button data-direction="center">Shoot Center</button>
    <button data-direction="right">Shoot Right</button>
  </div>

  <div id="keeperControls" class="keeper-actions hidden" aria-label="Goalkeeper controls">
    <button data-keeper="left">Goalkeeper Left</button>
    <button data-keeper="center">Goalkeeper Center</button>
    <button data-keeper="right">Goalkeeper Right</button>
  </div>

  <div class="secondary"><button id="restart">Restart Game</button></div>
</main>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const shotsEl = document.getElementById('shots');
const turnEl = document.getElementById('turn');
const statusEl = document.getElementById('status');
const modeEl = document.getElementById('mode');
const difficultyEl = document.getElementById('difficulty');
const volumeEl = document.getElementById('volume');
const volumeValueEl = document.getElementById('volumeValue');
const keeperControls = document.getElementById('keeperControls');
const shootingButtons = [...document.querySelectorAll('[data-direction]')];

const positions = { left: 150, center: 260, right: 370 };
const targetY = 92;
let score = 0, totalShots = 0, currentPlayer = 1;
let goalkeeperX = positions.center, targetX = positions.center;
let mode = modeEl.value, difficulty = difficultyEl.value;
let gameActive = true, shotInProgress = false;
let animationFrame = 0, shotFrame = 0, aiTimer = 0, roundToken = 0;
let ball = null;
let audioContext = null;

function getAudioContext() {
  if (!audioContext) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return null;
    audioContext = new AudioContext();
  }
  if (audioContext.state === 'suspended') audioContext.resume();
  return audioContext;
}
function playSound(type) {
  const audio = getAudioContext();
  if (!audio) return;
  const gain = audio.createGain();
  const oscillator = audio.createOscillator();
  const now = audio.currentTime;
  const volume = Number(volumeEl.value) / 100;
  const sounds = {
    kick: { frequency: 150, end: 65, duration: .16, level: .16 },
    save: { frequency: 180, end: 75, duration: .28, level: .2 },
    goal: { frequency: 420, end: 760, duration: .42, level: .22 }
  };
  const sound = sounds[type];
  oscillator.type = type === 'goal' ? 'triangle' : 'sine';
  oscillator.frequency.setValueAtTime(sound.frequency, now);
  oscillator.frequency.exponentialRampToValueAtTime(sound.end, now + sound.duration);
  gain.gain.setValueAtTime(Math.max(.001, sound.level * volume), now);
  gain.gain.exponentialRampToValueAtTime(.001, now + sound.duration);
  oscillator.connect(gain).connect(audio.destination);
  oscillator.start(now);
  oscillator.stop(now + sound.duration);
}

function setStatus(message) { statusEl.textContent = message; }
function updateBoard() {
  scoreEl.textContent = score;
  shotsEl.textContent = totalShots;
  turnEl.textContent = mode === 'two' ? currentPlayer : '—';
}
function setControls(enabled) { shootingButtons.forEach(button => button.disabled = !enabled); }
function setKeeperPosition(position) { targetX = positions[position]; }
function settings() {
  return { easy: { speed: .8, interval: 2800 }, normal: { speed: 1.6, interval: 1900 }, hard: { speed: 2.8, interval: 1200 } }[difficulty];
}
function chooseAIPosition() {
  if (mode === 'single' && gameActive && !shotInProgress) {
    const keys = Object.keys(positions);
    setKeeperPosition(keys[Math.floor(Math.random() * keys.length)]);
  }
}
function moveGoalkeeper() {
  const speed = settings().speed;
  const distance = targetX - goalkeeperX;
  goalkeeperX += Math.abs(distance) <= speed ? distance : Math.sign(distance) * speed;
}
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#b8e8f0'); sky.addColorStop(1, '#72bd91');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#eef5f7'; ctx.fillRect(80, 64, 360, 218);
  ctx.strokeStyle = '#526579'; ctx.lineWidth = 7; ctx.strokeRect(80, 64, 360, 218);
  ctx.strokeStyle = '#b6c8d1'; ctx.lineWidth = 1;
  for (let x = 95; x < 440; x += 22) { ctx.beginPath(); ctx.moveTo(x, 70); ctx.lineTo(x, 278); ctx.stroke(); }
  for (let y = 82; y < 282; y += 22) { ctx.beginPath(); ctx.moveTo(84, y); ctx.lineTo(436, y); ctx.stroke(); }
  ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.arc(goalkeeperX, 112, 25, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#172033'; ctx.fillRect(goalkeeperX - 18, 134, 36, 58);
  if (ball) {
    ctx.save();
    ctx.fillStyle = '#111827';
    ctx.shadowColor = '#0008';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.arc(ball.x - 3, ball.y - 3, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}
function animateScene() {
  moveGoalkeeper();
  draw();
  if (gameActive) animationFrame = requestAnimationFrame(animateScene);
}
function shoot(direction) {
  if (!gameActive || shotInProgress) return;
  shotInProgress = true;
  playSound('kick');
  setControls(false);
  const endX = positions[direction], startX = 260, startY = 270;
  const started = performance.now(), duration = 700;
  const token = roundToken;
  cancelAnimationFrame(shotFrame);
  function ballFrame(now) {
    if (!gameActive || token !== roundToken) return;
    const progress = Math.min((now - started) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    ball = {
      x: startX + (endX - startX) * eased,
      y: startY + (targetY - startY) * eased - Math.sin(progress * Math.PI) * 24,
      radius: 11 - progress * 2
    };
    draw();
    if (progress < 1) shotFrame = requestAnimationFrame(ballFrame);
    else finishShot(endX, token);
  }
  shotFrame = requestAnimationFrame(ballFrame);
}
function finishShot(ballX, token) {
  if (token !== roundToken || !shotInProgress) return;
  const saved = Math.hypot(ballX - goalkeeperX, targetY - 112) < 43;
  totalShots++;
  if (saved) {
    playSound('save');
    setStatus(mode === 'two' ? `Player ${currentPlayer}: saved!` : 'Saved by the goalkeeper!');
  } else {
    score++;
    playSound('goal');
    setStatus(mode === 'two' ? `Player ${currentPlayer}: GOAL!` : 'GOAL! Great shot!');
  }
  if (mode === 'two') currentPlayer = currentPlayer === 1 ? 2 : 1;
  updateBoard();
  shotInProgress = false;
  ball = null;
  draw();
  setControls(gameActive);
}
function restartGame() {
  cancelAnimationFrame(animationFrame);
  cancelAnimationFrame(shotFrame);
  clearTimeout(aiTimer);
  roundToken++;
  score = 0; totalShots = 0; currentPlayer = 1; gameActive = true; shotInProgress = false;
  ball = null;
  goalkeeperX = targetX = positions.center; keeperControls.classList.toggle('hidden', mode !== 'two');
  updateBoard(); setControls(true); setStatus('Choose a direction to shoot.'); draw(); animateScene(); scheduleAI();
}
function scheduleAI() {
  clearTimeout(aiTimer);
  if (mode !== 'single' || !gameActive) return;
  aiTimer = setTimeout(() => { chooseAIPosition(); scheduleAI(); }, settings().interval);
}
modeEl.addEventListener('change', () => { mode = modeEl.value; restartGame(); });
difficultyEl.addEventListener('change', () => { difficulty = difficultyEl.value; scheduleAI(); });
volumeEl.addEventListener('input', () => {
  volumeValueEl.textContent = `${volumeEl.value}%`;
});
shootingButtons.forEach(button => button.addEventListener('click', () => shoot(button.dataset.direction)));
keeperControls.addEventListener('click', event => { if (event.target.dataset.keeper) setKeeperPosition(event.target.dataset.keeper); });
document.getElementById('restart').addEventListener('click', restartGame);
restartGame();
</script>
</body>
</html>
