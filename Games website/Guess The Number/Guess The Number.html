<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Guess The Number Game</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="container">
    <h1>Guess The Number</h1>
    <div class="selector-group">
        <label for="range">Select Range:</label>
        <select id="range">
            <option value="10">1-10</option>
            <option value="50">1-50</option>
            <option value="100">1-100</option>
            <option value="1000">1-1000</option>
            <option value="10000">1-10,000</option>
            <option value="1000000">1-1,000,000</option>
            <option value="10000000">1-10,000,000</option>
            <option value="100000000">1-100,000,000</option>
        </select>
    </div>
    <div class="selector-group">
        <label for="difficulty">Select Difficulty:</label>
        <select id="difficulty">
            <option value="easy">Easy (60s)</option>
            <option value="medium">Medium (30s)</option>
            <option value="hard">Hard (15s)</option>
        </select>
    </div>
    <div class="timer">
        <span>Time Left: </span><span id="timeLeft">60</span> seconds
    </div>
    <div class="input-group">
        <input type="number" id="guess" placeholder="Enter your guess" aria-label="Your guess" />
    </div>
    <div class="button-group">
        <button id="submit">Guess</button>
        <button id="reset">Reset</button>
        <button id="showAnswer">Show Answer</button>
        <button id="exit" onclick="window.location.href='../games.html'">Exit</button>
    </div>
    <div id="message" class="message"></div>
    <div id="answerDisplay" class="answer"></div>
    <div class="score-board">
        <p>Score: <span id="score">0</span></p>
        <p>High Score: <span id="highScore">0</span></p>
        <p>Combo: <span id="combo">0</span></p>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
