<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Hangman — Word Challenge</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(30, 41, 59, .9);
      --panel-light: #1e293b;
      --text: #f8fafc;
      --muted: #a7b2c5;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --good: #34d399;
      --danger: #fb7185;
      --line: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 18px;
      display: grid; place-items: center;
      color: var(--text); font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(circle at 15% 10%, #312e81 0, transparent 35%),
                  radial-gradient(circle at 90% 90%, #164e63 0, transparent 38%), var(--bg);
    }
    .app { width: min(960px, 100%); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(1.55rem, 4vw, 2.35rem); letter-spacing: -.04em; }
    .subtitle { color: var(--muted); margin: 5px 0 0; font-size: .92rem; }
    .sound-control { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 14px; background: rgba(15,23,42,.65); }
    .sound-control button { border: 0; background: transparent; color: var(--text); cursor: pointer; font-size: 1.15rem; padding: 0; }
    #exit-btn { display: inline-block; padding: 10px 15px; border-radius: 12px; background: #334155; color: var(--text); font-weight: 800; text-decoration: none; transition: transform .15s, filter .15s; }
    #exit-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
    input[type="range"] { accent-color: var(--accent-2); width: 105px; }
    #volumeValue { width: 37px; color: var(--muted); font-size: .82rem; text-align: right; }
    .layout { display: grid; grid-template-columns: 1fr 1.25fr; gap: 18px; }
    .card { padding: clamp(18px, 4vw, 30px); background: var(--panel); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25); backdrop-filter: blur(12px); }
    .visual { display: grid; place-items: center; min-height: 340px; text-align: center; }
    .emoji { font-size: clamp(6rem, 18vw, 10rem); line-height: 1; filter: drop-shadow(0 12px 18px rgba(0,0,0,.25)); }
    .tries { margin-top: 18px; color: var(--muted); font-weight: 700; }
    .tries strong { color: var(--accent-2); font-size: 1.2rem; }
    .game-card { display: flex; flex-direction: column; }
    .setup { display: flex; gap: 10px; align-items: end; }
    label { display: block; color: var(--muted); font-size: .86rem; margin-bottom: 7px; }
    select, #letterInput { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-light); color: var(--text); font: inherit; outline: none; }
    select:focus, #letterInput:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(34,211,238,.15); }
    .select-wrap { flex: 1; }
    button.primary, button.secondary { border: 0; border-radius: 12px; padding: 13px 17px; color: white; font-weight: 800; font: inherit; cursor: pointer; transition: transform .15s, filter .15s; white-space: nowrap; }
    button.primary { background: linear-gradient(135deg, var(--accent), #6366f1); }
    button.secondary { background: #334155; }
    button:hover { filter: brightness(1.15); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .word { min-height: 58px; margin: 34px 0 12px; display: flex; justify-content: center; flex-wrap: wrap; gap: 7px; }
    .letter { width: 30px; height: 42px; border-bottom: 3px solid var(--accent-2); font-size: 1.55rem; font-weight: 800; text-transform: uppercase; }
    .message { min-height: 28px; text-align: center; color: var(--muted); font-weight: 700; }
    .message.good { color: var(--good); } .message.bad { color: var(--danger); }
    .guess-row { display: flex; gap: 10px; margin-top: 16px; }
    #letterInput { max-width: 180px; text-align: center; text-transform: uppercase; font-size: 1.15rem; }
    .keyboard { display: grid; grid-template-columns: repeat(9, 1fr); gap: 7px; margin-top: 22px; }
    .key { padding: 10px 2px; border: 1px solid var(--line); border-radius: 9px; background: #263449; color: var(--text); font-weight: 800; cursor: pointer; }
    .key:hover { background: #40516a; } .key.used { opacity: .35; cursor: not-allowed; } .key.correct { background: #087f68; } .key.wrong { background: #9f314a; }
    .actions { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
    .hidden { display: none !important; }
    @media (max-width: 700px) {
      body { padding: 12px; align-items: start; } .topbar { align-items: flex-start; flex-direction: column; }
      .sound-control { width: 100%; } input[type="range"] { flex: 1; }
      .layout { grid-template-columns: 1fr; } .visual { min-height: 190px; padding: 18px; } .emoji { font-size: 6rem; }
      .keyboard { grid-template-columns: repeat(7, 1fr); gap: 6px; } .key { padding: 11px 1px; }
    }
    @media (max-width: 380px) { .setup { flex-direction: column; align-items: stretch; } .guess-row { flex-direction: column; } #letterInput { max-width: none; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><h1>🎯 Hangman</h1><p class="subtitle">Find the word before the final mistake.</p></div>
      <div class="sound-control" aria-label="Game controls">
        <a id="exit-btn" href="../Games.html">Exit</a>
        <button id="soundButton" type="button" aria-label="Mute sound">🔊</button>
        <input id="volume" type="range" min="1" max="100" value="65" aria-label="Volume" />
        <span id="volumeValue">65%</span>
      </div>
    </header>

    <section class="layout">
      <div class="card visual" aria-live="polite">
        <div><div id="hangman" class="emoji">🙂</div><div class="tries">Tries left: <strong id="triesLeft">10</strong></div></div>
      </div>
      <div class="card game-card">
        <div id="setup">
          <label for="wordSelect">Choose your challenge</label>
          <div class="setup"><div class="select-wrap"><select id="wordSelect"><option value="">Select a word...</option></select></div><button id="startButton" class="primary" type="button">Start game</button></div>
        </div>
        <div id="word" class="word" aria-label="Hidden word"></div>
        <div id="message" class="message" aria-live="assertive">Choose a word to begin.</div>
        <div id="guessArea" class="hidden">
          <div class="guess-row"><input id="letterInput" type="text" maxlength="1" inputmode="text" autocomplete="off" placeholder="A–Z" aria-label="Guess one letter" /><button id="guessButton" class="primary" type="button">Guess letter</button></div>
          <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>
        </div>
        <div class="actions"><button id="answerButton" class="secondary hidden" type="button">Show answer</button><button id="restartButton" class="primary hidden" type="button">Play again</button></div>
        <div id="answerDisplay" class="message hidden"></div>
      </div>
    </section>
  </main>

  <script>
    const words = ['javascript','hangman','coding','developer','programming','html','css','skull','bozo','funny','awesome','challenge','diddy','bigmother'];
    const $ = id => document.getElementById(id);
    const els = { select: $('wordSelect'), start: $('startButton'), setup: $('setup'), word: $('word'), message: $('message'), input: $('letterInput'), guess: $('guessButton'), area: $('guessArea'), keyboard: $('keyboard'), answer: $('answerButton'), restart: $('restartButton'), answerDisplay: $('answerDisplay'), hangman: $('hangman'), tries: $('triesLeft'), volume: $('volume'), volumeValue: $('volumeValue'), sound: $('soundButton') };
    let selectedWord = '', guessed = new Set(), tries = 10, muted = false, audio;
    const stages = ['💀','😵','😖','😩','😫','☹️','🙁','😕','😐','🙂','😃'];

    words.forEach(word => { const option = document.createElement('option'); option.value = word; option.textContent = word[0].toUpperCase() + word.slice(1); els.select.appendChild(option); });
    function tone(type) {
      if (muted || Number(els.volume.value) === 0) return;
      audio ||= new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audio.createOscillator(), gain = audio.createGain();
      oscillator.type = 'sine'; oscillator.frequency.value = type === 'good' ? 660 : type === 'bad' ? 170 : 420;
      gain.gain.setValueAtTime(Number(els.volume.value) / 100 * .08, audio.currentTime); gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .16);
      oscillator.connect(gain).connect(audio.destination); oscillator.start(); oscillator.stop(audio.currentTime + .17);
    }
    function renderWord() { els.word.innerHTML = [...selectedWord].map(letter => `<span class="letter">${guessed.has(letter) ? letter : '&nbsp;'}</span>`).join(''); }
    function renderKeyboard() { els.keyboard.innerHTML = 'abcdefghijklmnopqrstuvwxyz'.split('').map(letter => `<button class="key ${guessed.has(letter) ? (selectedWord.includes(letter) ? 'correct' : 'wrong') : ''}" data-letter="${letter}" ${guessed.has(letter) ? 'disabled' : ''}>${letter.toUpperCase()}</button>`).join(''); }
    function update() { renderWord(); renderKeyboard(); els.hangman.textContent = stages[tries]; els.tries.textContent = tries; }
    function endGame(won) { els.area.classList.add('hidden'); els.answer.classList.add('hidden'); els.restart.classList.remove('hidden'); els.message.textContent = won ? '🎉 Amazing! You found the word!' : `Game over — the word was “${selectedWord}”.`; els.message.className = `message ${won ? 'good' : 'bad'}`; tone(won ? 'good' : 'bad'); }
    function guess(letter) {
      letter = letter.toLowerCase().replace(/[^a-z]/g, ''); if (!letter || guessed.has(letter) || !selectedWord || tries === 0) return;
      guessed.add(letter); els.input.value = '';
      if (!selectedWord.includes(letter)) { tries--; tone('bad'); } else tone('good');
      update();
      if ([...selectedWord].every(char => guessed.has(char))) endGame(true); else if (!tries) endGame(false);
    }
    function startGame() { selectedWord = els.select.value; if (!selectedWord) { els.message.textContent = 'Please choose a word first.'; return; } guessed = new Set(); tries = 10; els.setup.classList.add('hidden'); els.area.classList.remove('hidden'); els.answer.classList.remove('hidden'); els.restart.classList.add('hidden'); els.answerDisplay.classList.add('hidden'); els.message.className = 'message'; els.message.textContent = 'Pick a letter or use your keyboard.'; update(); els.input.focus(); tone('start'); }
    els.start.addEventListener('click', startGame); els.guess.addEventListener('click', () => guess(els.input.value)); els.input.addEventListener('keydown', event => { if (event.key === 'Enter') guess(els.input.value); });
    els.keyboard.addEventListener('click', event => { if (event.target.dataset.letter) guess(event.target.dataset.letter); });
    document.addEventListener('keydown', event => { if (/^[a-z]$/i.test(event.key) && !els.area.classList.contains('hidden')) guess(event.key); });
    els.answer.addEventListener('click', () => { els.answerDisplay.textContent = `The word was: “${selectedWord}”`; els.answerDisplay.classList.remove('hidden'); });
    els.restart.addEventListener('click', () => { els.setup.classList.remove('hidden'); els.area.classList.add('hidden'); els.answer.classList.add('hidden'); els.restart.classList.add('hidden'); els.answerDisplay.classList.add('hidden'); els.select.value = ''; els.word.innerHTML = ''; els.message.className = 'message'; els.message.textContent = 'Choose a word to begin.'; els.hangman.textContent = '🙂'; els.tries.textContent = '10'; });
    els.volume.addEventListener('input', () => { els.volumeValue.textContent = `${els.volume.value}%`; if (Number(els.volume.value)) muted = false; els.sound.textContent = muted ? '🔇' : '🔊'; });
    els.sound.addEventListener('click', () => { muted = !muted; els.sound.textContent = muted ? '🔇' : '🔊'; els.sound.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound'); });
  </script>
</body>
</html>
