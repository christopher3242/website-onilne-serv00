<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f0f0f0;
    margin: 0;
    padding: 20px;
  }
  h1 {
    margin-bottom: 10px;
  }
  #colorCircle {
    width: 150px;
    height: 150px;
    margin: 20px auto;
    border-radius: 50%;
    border: 4px solid #333;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    background-color: #fff;
  }
  #colorName {
    font-size: 1.5em;
    margin-top: 10px;
    font-weight: bold;
  }
  #scoreDisplay {
    font-size: 1.2em;
    margin-top: 10px;
  }
  .buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
  }
  button {
    padding: 12px 24px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background-color: #4CAF50;
    color: white;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    transition: background-color 0.2s, transform 0.1s;
  }
  button:hover {
    background-color: #45a049;
    transform: scale(1.02);
  }
  #message {
    margin-top: 20px;
    font-size: 1.2em;
    min-height: 1.2em;
  }
  #controls {
    margin-top: 20px;
  }
  #resetBtn,
  #answerBtn,
  #exitBtn {
    margin: 10px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 4px;
    border: none;
    background-color: #4CAF50;
    color: white;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    transition: background-color 0.2s;
  }
  #resetBtn:hover,
  #answerBtn:hover,
  #exitBtn:hover {
    background-color: #45a049;
  }
  /* Responsive adjustments */
  @media(max-width: 500px) {
    #colorCircle {
      width: 120px;
      height: 120px;
    }
    button {
      padding: 10px 20px;
      font-size: 14px;
    }
  }
</style>
</head>

<div id="colorCircle"></div>
<div id="colorName">Color Name</div>
<div id="scoreDisplay">Score: 0</div>
<div class="buttons" id="choices" style="display: none;"></div>
<div id="message"></div>
<div id="controls">
  <button id="resetBtn">Start Game</button>
  <button id="answerBtn" style="display: none;">Show Answer</button>
  <a href="../Games.html" style="text-decoration: none;">
    <button id="exitBtn">Exit</button>

    { name: 'SpringGreen', hex: '#00FF7F' },

    { name: 'Tan', hex: '#D2B48C' },

    { name: 'Tomato', hex: '#FF6347' },

    { name: 'Violet', hex: '#EE82EE' },

    { name: 'WhiteSmoke', hex: '#F5F5F5' },
    { name: 'YellowGreen', hex: '#9ACD32' }
  ];

  let correctColor = null;
  let options = [];
  let score = 0;
  let answerTimeoutId = null;
  let hideMessageTimeoutId = null;

  function getRandomInt(max) {
    return Math.floor(Math.random() * max);
  }

  function updateScore() {
    scoreDisplay.textContent = 'Score: ' + score;
  }

  function setupNewRound() {
    // Clear timeouts
    if (answerTimeoutId !== null) {
      clearTimeout(answerTimeoutId);
      answerTimeoutId = null;
    }
    if (hideMessageTimeoutId !== null) {
      clearTimeout(hideMessageTimeoutId);
      hideMessageTimeoutId = null;
    }
    messageDiv.textContent = '';
    choicesDiv.innerHTML = '';
    choicesDiv.style.display = 'none';
    answerBtn.style.display = 'none';
    colorNameDiv.textContent = 'Color Name';
    // Pick a new color
    correctColor = colorList[getRandomInt(colorList.length)];
    colorCircle.style.backgroundColor = correctColor.hex;
    resetBtn.textContent = 'Start Game';
  }

  function startGameRound() {
    if (answerTimeoutId !== null) {
      clearTimeout(answerTimeoutId);
      answerTimeoutId = null;
    }
    if (hideMessageTimeoutId !== null) {
      clearTimeout(hideMessageTimeoutId);
      hideMessageTimeoutId = null;
    }
    messageDiv.textContent = '';
    colorNameDiv.textContent = 'What is this color?';
    choicesDiv.style.display = 'flex';
    answerBtn.style.display = 'inline-block';

    // Generate options
    options = [correctColor];
    while (options.length < 4) {
      const randColor = colorList[getRandomInt(colorList.length)];
      if (!options.some(c => c.name === randColor.name)) {
        options.push(randColor);
      }
    }
    // Shuffle options
    for (let i = options.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [options[i], options[j]] = [options[j], options[i]];
    }

    // Create buttons
    choicesDiv.innerHTML = '';
    options.forEach(option => {
      const btn = document.createElement('button');
      btn.textContent = option.name;
      btn.onclick = () => {
        if (option.name === correctColor.name) {
          messageDiv.textContent = 'Correct! 🎉';
          score++;
          updateScore();
          choicesDiv.style.display = 'none';
          answerBtn.style.display = 'none';
          resetBtn.textContent = 'Play Again';
        } else {
          messageDiv.textContent = 'Try Again!';
          score = Math.max(0, score - 1); // prevent negative score
          updateScore();
          // Hide message after 2 seconds
          if (hideMessageTimeoutId !== null) {
            clearTimeout(hideMessageTimeoutId);
          }
          hideMessageTimeoutId = setTimeout(() => {
            messageDiv.textContent = '';
          }, 2000);
        }
      };
      choicesDiv.appendChild(btn);
    });

    resetBtn.textContent = 'Play Again';
  }

  resetBtn.onclick = () => {
    if (resetBtn.textContent === 'Start Game') {
      startGameRound();
    } else {
      setupNewRound();
    }
  };

  answerBtn.onclick = () => {
    // Show the answer temporarily
    colorNameDiv.textContent = correctColor.name;
    if (answerTimeoutId !== null) {
      clearTimeout(answerTimeoutId);
    }
    answerTimeoutId = setTimeout(() => {
      colorNameDiv.textContent = 'What is this color?';
      answerTimeoutId = null;
    }, 2000);
  };

  // Initialize the game
  setupNewRound();
  updateScore();
</script>
