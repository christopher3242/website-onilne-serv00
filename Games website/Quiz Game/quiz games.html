<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Game</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #15803d;
      --danger: #dc2626;
      --selected: #f59e0b;
      --text: #1f2937;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #64748b, #3b82f6);
    }

    .quiz-container {
      width: min(100%, 540px);
      padding: 30px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .2);
    }

    h1 { margin: 0 0 12px; text-align: center; }

    #score, #progress {
      text-align: center;
      font-weight: bold;
      color: #475569;
    }

    #progress { margin-bottom: 22px; font-size: .95rem; }

    #question {
      margin-bottom: 20px;
      font-size: 1.3rem;
      font-weight: bold;
      text-align: center;
    }

    #answer-buttons { display: grid; gap: 10px; }

    .btn {
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-radius: 9px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }

    .btn:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
    .btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .btn:disabled { cursor: not-allowed; opacity: .8; }
    .answer.selected { background: var(--selected); color: #111827; }
    .answer.correct { background: var(--success); }
    .answer.wrong { background: var(--danger); }

    #feedback {
      min-height: 28px;
      margin: 18px 0 0;
      font-weight: bold;
      text-align: center;
    }

    .controls { display: grid; gap: 10px; margin-top: 18px; }
    #submit-button { background: #0f766e; }
    #submit-button:hover:not(:disabled) { background: #115e59; }
    #show-answer { background: #64748b; }
    #show-answer:hover:not(:disabled) { background: #475569; }
    .exit-button { display: block; text-align: center; text-decoration: none; background: #475569; padding: 10px; border-radius: 8px; color: #fff; }

    @media (max-width: 500px) {
      .quiz-container { padding: 22px; }
      #question { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <main class="quiz-container">
    <h1>Quiz Game</h1>
    <div id="score" aria-live="polite">Score: 0</div>
    <div id="progress" aria-live="polite"></div>
    <div id="question" aria-live="polite"></div>
    <div id="answer-buttons" role="group" aria-label="Answer choices"></div>
    <div id="feedback" aria-live="polite"></div>

    <div class="controls">
      <button id="submit-button" class="btn" type="button" disabled>Check Answer</button>
      <button id="show-answer" class="btn" type="button">Show Answer</button>
      <button id="next-button" class="btn" type="button" hidden>Next Question</button>
      <button id="restart-button" class="btn" type="button" hidden>Play Again</button>
      <a class="btn exit-button" href="../Games.html">Exit</a>
    </div>
  </main>

  <script>
    const questionElement = document.getElementById('question');
    const answerButtons = document.getElementById('answer-buttons');
    const scoreElement = document.getElementById('score');
    const progressElement = document.getElementById('progress');
    const feedbackElement = document.getElementById('feedback');
    const submitButton = document.getElementById('submit-button');
    const showAnswerButton = document.getElementById('show-answer');
    const nextButton = document.getElementById('next-button');
    const restartButton = document.getElementById('restart-button');

    const questions = [
      {
        question: 'What is 2 + 2?',
        answers: [
          { text: '3', correct: false },
          { text: '4', correct: true },
          { text: '5', correct: false },
          { text: '6', correct: false }
        ]
      },
      {
        question: 'What is the capital of France?',
        answers: [
          { text: 'Berlin', correct: false },
          { text: 'Madrid', correct: false },
          { text: 'Paris', correct: true },
          { text: 'Lisbon', correct: false }
        ]
      },
      {
        question: 'What is the largest ocean on Earth?',
        answers: [
          { text: 'Indian Ocean', correct: false },
          { text: 'Atlantic Ocean', correct: false },
          { text: 'Arctic Ocean', correct: false },
          { text: 'Pacific Ocean', correct: true }
        ]
      },
      {
        question: 'What is this Bozo?',
        answers: [
          { text: 'L', correct: true },
          { text: 'Brairot', correct: false },
          { text: 'maggot', correct: false },
          { text: 'get out', correct: false }
        ]
      },
      {
        question: 'What is Cock?',
        answers: [
          { text: 'Suck up', correct: false },
          { text: 'Balls', correct: true },
          { text: 'Diddy and Drake Oil', correct: false },
          { text: 'Sex', correct: false }
        ]
      },
      {
        question: 'What is Goofy?',
        answers: [
          { text: 'n/a', correct: false },
          { text: 'Ahh!', correct: true },
          { text: 'oi', correct: false },
          { text: 'niessie', correct: false }
        ]
      },
      {
        question: 'What are diddy?',
        answers: [
          { text: 'oil', correct: true },
          { text: 'Hit and run', correct: false },
          { text: 'bro', correct: false },
          { text: 'No care', correct: false }
        ]
      },
      {
        question: 'What are room night?',
        answers: [
          { text: 'Lol', correct: false },
          { text: 'L + bozo', correct: false },
          { text: 'sex and sleep', correct: true },
          { text: 'shut up', correct: false }
        ]
      },
      {
        question: 'What If ?',
        answers: [
          { text: 'F you', correct: true },
          { text: 'ohohoho', correct: false },
          { text: 'grounded', correct: true },
          { text: 'shut down idoit', correct: false }
        ]
      },
      {
        question: 'which this brainrot?',
        answers: [
          { text: '67', correct: true },
          { text: 'tung tung', correct: true },
          { text: 'skiddi tolite', correct: true },
          { text: 'son a milk', correct: true }
        ]
      }
    ];

    let score = 0;
    let currentQuestionIndex = 0;
    let selectedIndex = null;
    let questionFinished = false;

    function startGame() {
      score = 0;
      currentQuestionIndex = 0;
      scoreElement.textContent = 'Score: 0';
      restartButton.hidden = true;
      showQuestion();
    }

    function showQuestion() {
      const current = questions[currentQuestionIndex];
      selectedIndex = null;
      questionFinished = false;
      questionElement.textContent = current.question;
      progressElement.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
      feedbackElement.textContent = '';
      answerButtons.innerHTML = '';
      submitButton.disabled = true;
      submitButton.hidden = false;
      showAnswerButton.hidden = false;
      showAnswerButton.disabled = false;
      nextButton.hidden = true;

      current.answers.forEach((answer, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn answer';
        button.textContent = answer.text;
        button.addEventListener('click', () => selectAnswer(index));
        answerButtons.appendChild(button);
      });
    }

    function selectAnswer(index) {
      if (questionFinished) return;
      selectedIndex = index;
      [...answerButtons.children].forEach((button, buttonIndex) => {
        button.classList.toggle('selected', buttonIndex === index);
      });
      submitButton.disabled = false;
    }

    function finishQuestion(revealed = false) {
      if (questionFinished) return;
      questionFinished = true;
      const current = questions[currentQuestionIndex];
      const buttons = [...answerButtons.children];

      const correctAnswers = current.answers
        .map((ans, idx) => ({ ...ans, index: idx }))
        .filter(answer => answer.correct);
      const correctAnswerText = correctAnswers.map(ans => ans.text).join(', ');
      const isCorrect = selectedIndex !== null && current.answers[selectedIndex].correct;

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (current.answers[index].correct) {
          button.classList.add('correct');
        } else if (index === selectedIndex) {
          button.classList.add('wrong');
        }
      });

      if (!revealed && isCorrect) {
        score++;
        scoreElement.textContent = `Score: ${score}`;
        feedbackElement.textContent = 'Correct!';
      } else if (revealed) {
        feedbackElement.textContent = `Answer: ${correctAnswerText}`;
      } else {
        feedbackElement.textContent = `Not quite. The correct answer is ${correctAnswerText}.`;
      }

      submitButton.hidden = true;
      showAnswerButton.hidden = true;
      nextButton.hidden = false;
    }

    submitButton.addEventListener('click', () => finishQuestion());
    showAnswerButton.addEventListener('click', () => finishQuestion(true));

    nextButton.addEventListener('click', () => {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        questionElement.textContent = 'Quiz Finished!';
        progressElement.textContent = '';
        answerButtons.innerHTML = '';
        feedbackElement.textContent = `Your final score is ${score} out of ${questions.length}.`;
        nextButton.hidden = true;
        restartButton.hidden = false;
      }
    });

    restartButton.addEventListener('click', startGame);

    // Initialize game on load
    startGame();
  </script>
</body>
</html>
