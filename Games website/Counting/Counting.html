<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Counting Game - 150 Goals</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background-color: #f0f8ff;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 20px;
      text-align: center;
    }

    #countDisplay {
      font-size: 4em;
      margin: 20px 0;
      padding: 10px 20px;
      background-color: #fff;
      border: 3px solid #ccc;
      border-radius: 10px;
      width: fit-content;
      min-width: 150px;
      text-align: center;
      transition: transform 0.2s, background-color 0.2s;
    }
    #countDisplay.animate {
      transform: scale(1.2);
      background-color: #d4edda;
    }

    #timeDisplay, #topTimeDisplay {
      font-size: 1.2em;
      margin: 10px 0;
    }

    #message {
      font-size: 1.2em;
      margin: 15px 0;
      min-height: 30px;
    }

    button {
      font-size: 1.2em;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    #exitBtn {
      background-color: #f44336;
    }
    #exitBtn:hover {
      background-color: #da190b;
    }

    /* Responsive adjustments for smaller screens */
    @media (max-width: 500px) {
      h1 {
        font-size: 1.5em;
      }
      #countDisplay {
        font-size: 3em;
        padding: 8px 16px;
      }
      button {
        font-size: 1em;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>
  <h1>Counting Game - Reach 150 Goals!</h1>
  <div id="countDisplay">0</div>
  <div id="timeDisplay">Time: 0.0 sec</div>
  <div id="topTimeDisplay">Top Time: N/A</div>
  <div id="message"></div>
  <div>
    <button id="countBtn">Count</button>
    <button id="restartBtn">Restart</button>
    <a href="../games.html"><button id="exitBtn">Exit</button></a>
  </div>

  <script>
    const target = 150;
    let count = 0;
    let startTime = null;
    let timerInterval = null;
    let countdownInterval = null;
    const maxTime = 60; // seconds

    const countDisplay = document.getElementById('countDisplay');
    const messageDiv = document.getElementById('message');
    const timeDisplay = document.getElementById('timeDisplay');
    const topTimeDisplay = document.getElementById('topTimeDisplay');

    const countBtn = document.getElementById('countBtn');
    const restartBtn = document.getElementById('restartBtn');

    // Load top time from local storage
    let topTime = localStorage.getItem('topTime') ? parseFloat(localStorage.getItem('topTime')) : null;
    if (topTime !== null) {
      topTimeDisplay.textContent = `Top Time: ${topTime.toFixed(1)} sec`;
    } else {
      topTimeDisplay.textContent = 'Top Time: N/A';
    }

    // Function to start the timer when first click occurs
    function startTimer() {
      startTime = Date.now();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTime, 100);
      startCountdown();
    }

    // Function to start countdown from maxTime
    function startCountdown() {
      let remainingTime = maxTime;
      document.getElementById('timeDisplay').textContent = `Time: ${remainingTime.toFixed(1)} sec`;
      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        remainingTime -= 0.1;
        if (remainingTime <= 0) {
          clearInterval(countdownInterval);
          stopTimer();
          messageDiv.innerHTML = '<span style="color: red; font-weight: bold;">Time\'s up! Try again.</span>';
          countBtn.disabled = true;
        } else {
          document.getElementById('timeDisplay').textContent = `Time: ${remainingTime.toFixed(1)} sec`;
        }
      }, 100);
    }

    // Function to update elapsed time
    function updateTime() {
      const elapsed = (Date.now() - startTime) / 1000;
      timeDisplay.textContent = `Time: ${elapsed.toFixed(1)} sec`;
    }

    // Function to stop the timer
    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // Function to update top time in local storage
    function updateTopTime(time) {
      if (topTime === null || time < topTime) {
        topTime = time;
        localStorage.setItem('topTime', topTime);
        topTimeDisplay.textContent = `Top Time: ${topTime.toFixed(1)} sec`;
      }
    }

    // Function to update the count display and check for goal
    function updateDisplay() {
      countDisplay.textContent = count;
      if (count === target) {
        stopTimer();
        clearInterval(countdownInterval);
        const totalTime = (Date.now() - startTime) / 1000;
        updateTopTime(totalTime);
        // Animate success
        countDisplay.classList.add('animate');
        setTimeout(() => countDisplay.classList.remove('animate'), 300);
        // Show success message
        messageDiv.innerHTML = '<span style="color: green; font-weight: bold;">Good job! You reached 150!</span>';
        countBtn.disabled = true;
      }
    }

    // Event listener for Count button
    document.getElementById('countBtn').addEventListener('click', () => {
      if (count === 0) {
        startTimer();
      }
      if (count < target) {
        count++;
        updateDisplay();
      }
    });

    // Event listener for Restart button
    document.getElementById('restartBtn').addEventListener('click', () => {
      count = 0;
      messageDiv.innerHTML = '';
      countBtn.disabled = false;
      stopTimer();
      clearInterval(countdownInterval);
      document.getElementById('timeDisplay').textContent = `Time: 0.0 sec`;
      updateDisplay();
    });

    // Initialize display
    updateDisplay();
  </script>
</body>
</html>
