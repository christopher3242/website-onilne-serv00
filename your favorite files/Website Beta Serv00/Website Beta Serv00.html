<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Website Beta Serv00</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #f0f4f8; /* Light background color for better UI */
    margin: 0;
    padding: 20px;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    font-size: 2em;
    font-weight: bold;
    color: #2c3e50;
    margin-bottom: 30px;
  }

  /* Table styles for responsiveness and aesthetics */
  table {
    width: 100%;
    max-width: 985px;
    border-collapse: collapse;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 30px;
  }

  td {
    padding: 15px;
    background-color: #fff;
    border: 1px solid #ccc;
    font-size: 1.2em;
    text-align: center;
  }

  a {
    color: #2980b9;
    text-decoration: none;
    transition: color 0.3s, text-decoration 0.3s;
  }

  a:hover {
    color: #3498db;
    text-decoration: underline;
  }

  /* Exit button styles */
  .exit-container {
    margin-top: 20px;
  }

  .exit-button {
    background-color: #e74c3c;
    color: #fff;
    border: none;
    padding: 14px 28px;
    font-size: 1.1em;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.2s;
  }

  .exit-button:hover,
  .exit-button:focus {
    background-color: #c0392b;
    outline: none;
    transform: translateY(-2px);
  }

  /* Responsive adjustments */
  @media(max-width: 600px) {
    header {
      font-size: 1.5em;
    }
    table {
      font-size: 1em;
    }
    .exit-button {
      width: 100%;
      padding: 12px;
    }
  }
</style>
</head>
<body>

<header>Website Beta Serv00</header>

<!-- Link Table -->
<table>
  <tbody>
    <tr>
      <td>
        <a href="https://88l9y7.csb.app/" target="_blank" rel="noopener noreferrer">
          https://88l9y7.csb.app/
        </a>
      </td>
    </tr>
  </tbody>
</table>

<!-- Exit Button -->
<div class="exit-container">
  <button class="exit-button" onclick="exitPage()">Exit</button>
</div>

<script>
  function exitPage() {
    // Redirect to your desired page
    window.location.href = "../../your%20favorite.html";
  }
</script>

</body>
</html>
