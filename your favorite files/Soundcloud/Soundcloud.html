<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SoundCloud Playlists</title>
<style>
  /* Reset and base styles */
  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    background-color: #375f9c;
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
  }

  /* Exit button styles */
  .exit-link {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
  }

  .exit-button {
    background-color: #fff;
    color: #375f9c;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: 1em;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: background-color 0.3s, transform 0.2s;
  }

  .exit-button:hover,
  .exit-button:focus {
    background-color: #ddd;
    transform: scale(1.05);
    outline: none;
  }

  /* Main title */
  h1 {
    width: 100%;
    max-width: 800px;
    text-align: center;
    font-size: 2.5em;
    margin-top: 80px;
    margin-bottom: 30px;
    font-weight: bold;
  }

  /* Playlist containers */
  .playlist {
    width: 100%;
    max-width: 800px;
    margin-bottom: 40px;
  }

  /* Embed styling */
  iframe {
    width: 100%;
    height: 450px;
    border-radius: 8px;
    border: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: transform 0.3s, box-shadow 0.3s;
  }

  iframe:hover {
    transform: scale(1.02);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }

  /* Caption styles */
  .caption {
    margin-top: 8px;
    font-size: 0.9em;
    color: #ccc;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .caption a {
    color: #ccc;
    text-decoration: underline;
    transition: color 0.3s;
  }

  .caption a:hover,
  .caption a:focus {
    color: #fff;
  }

  /* Responsive adjustments */
  @media(max-width: 600px) {
    body {
      padding: 10px;
    }
    h1 {
      font-size: 2em;
      margin-top: 60px;
      margin-bottom: 20px;
    }
    iframe {
      height: 350px;
    }
  }
</style>
</head>
<body>

<!-- Exit Button -->
<a href="../../your%20favorite.html" class="exit-link" aria-label="Exit to your favorite page">
