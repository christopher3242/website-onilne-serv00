<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<title>Blogger</title>
<style>
  body {
    background: linear-gradient(135deg, #1bc5a0, #159b8b);
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .container {
    background-color: #ffffff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    max-width: 800px;
    width: 100%;
    box-sizing: border-box;
  }

  h1 {
    text-align: center;
    font-size: 2.4em;
    margin-bottom: 20px;
    color: #333;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    border-radius: 8px;
    overflow: hidden;
  }

  td {
    padding: 15px;
    border: 1px solid #ddd;
    background-color: #f9f9f9;
  }

  a {
    display: block;
    color: #007bff;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s, transform 0.2s;
  }

  a:hover {
    color: #0056b3;
    transform: translateY(-2px);
  }

  .exit-link {
    display: flex;
    justify-content: flex-end;
    margin-top: 30px;
  }

  .exit-button {
    background-color: #80c6ff;
    color: #fff;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 1.1em;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.3s, box-shadow 0.2s;
  }

  .exit-button:hover {
    background-color: #66b0e0;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }

  /* Responsive adjustments */
  @media(max-width: 600px) {
    body {
      padding: 10px;
    }
    h1 {
      font-size: 2em;
    }
    .exit-button {
      padding: 8px 16px;
      font-size: 1em;
    }
  }
</style>
</head>
