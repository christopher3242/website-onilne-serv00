<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Webcam with Flashlight & Preview</title>
<style>
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h2 {
    margin-bottom: 15px;
    font-size: 1.8em;
    color: #333;
  }
  video {
    width: 100%;
    max-width: 700px;
    height: auto;
    border-radius: 10px;
    border: 2px solid #444;
    background: #000;
  }
  .buttons {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  button, a.btn {
    padding: 12px 20px;
    font-size: 1em;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
    transition: background-color 0.3s, transform 0.2s;
    min-width: 120px;
    text-align: center;
  }
  a.btn {
    text-decoration: none;
  }
  /* Specific styles for buttons */
  .start { background: #28a745; }
  .start:hover { background: #218838; }
  .stop { background: #dc3545; }
  .stop:hover { background: #a71d2a; }
  .switch { background: #ffc107; color: #212529; }
  .switch:hover { background: #e0a800; }
  .flashlight { background: #17a2b8; }
  .flashlight:hover { background: #117a8b; }
  .preview { background: #6f42c1; }
  .preview:hover { background: #59359b; }
  .exit { background: #6c757d; }
  .exit:hover { background: #5a6268; }

  /* Hold button styling */
  #holdBtn {
    background-color: #007bff;
    padding: 14px 28px;
    font-size: 1.1em;
    border-radius: 8px;
  }

  /* Hold duration input */
  #holdDurationContainer {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #holdDurationContainer input {
    width: 60px;
    padding: 6px 10px;
    font-size: 1em;
    border-radius: 4px;
    border: 1px solid #ccc;
    text-align: center;
  }

  /* Overlay for preview */
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 9999;
    padding: 20px;
  }
  #overlay img {
    max-width: 90%;
    max-height: 80%;
    border-radius: 10px;
    margin-bottom: 20px;
  }
  #overlay button {
    margin: 8px;
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 1em;
  }
  #downloadPreview { background: #28a745; color: #fff; }
  #downloadPreview:hover { background: #218838; }
  #closePreview { background: #dc3545; color: #fff; }
  #closePreview:hover { background: #a71d2a; }
</style>
</head>
<body>

<h2>Webcam with Flashlight, Hold Preview & Camera Preview</h2>
<video id="video" autoplay playsinline></video>

<div class="buttons">
  <a href="../../your%20favorite.html" class="btn exit">Exit</a>
  <button id="startBtn" class="btn start">Start Camera</button>
  <button id="stopBtn" class="btn stop">Stop Camera</button>
  <button id="switchBtn" class="btn switch">Switch Camera</button>
  <button id="flashlightBtn" class="btn flashlight">Toggle Flashlight</button>
  <button id="previewCameraBtn" class="btn preview">Preview Camera</button>
</div>

<div id="holdDurationContainer">
  <label for="holdDurationInput">Hold Duration (sec): </label>
  <input type="text" id="holdDurationInput" value="3" />
</div>

<div style="margin-top:15px; text-align:center;">
  <button id="holdBtn">Hold for Preview</button>
</div>

<!-- Overlay for static preview -->
<div id="overlay" role="dialog" aria-modal="true">
  <img id="previewImg" src="" alt="Preview" />
  <div>
    <button id="downloadPreview">Download PNG</button>
    <button id="closePreview">Close</button>
  </div>
</div>

<script>
const video = document.getElementById('video');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const switchBtn = document.getElementById('switchBtn');
const flashlightBtn = document.getElementById('flashlightBtn');
const previewCameraBtn = document.getElementById('previewCameraBtn');
const holdBtn = document.getElementById('holdBtn');
const overlay = document.getElementById('overlay');
const previewImg = document.getElementById('previewImg');
const downloadBtn = document.getElementById('downloadPreview');
const closeBtn = document.getElementById('closePreview');
const holdDurationInput = document.getElementById('holdDurationInput');

let stream = null;
let currentFacingMode = 'user';
let currentVideoTrack = null;
let torchOn = false;
let holdTimeout = null;

// Detect mobile for default camera
if (/Mobi|Android/i.test(navigator.userAgent)) {
  currentFacingMode = 'environment';
}

// Start camera
async function startCamera() {
  if (stream) stopCamera();
  try {
    const constraints = { video: { facingMode: currentFacingMode } };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    currentVideoTrack = stream.getVideoTracks()[0];
  } catch (err) {
    alert('Error accessing camera: ' + err.message);
  }
}

// Stop camera
function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    currentVideoTrack = null;
    video.srcObject = null;
  }
}

// Switch camera
function switchCamera() {
  currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
  startCamera();
}

// Toggle flashlight
async function toggleFlashlight() {
  if (!currentVideoTrack) {
    alert('Start camera first');
    return;
  }
  const cap = currentVideoTrack.getCapabilities();
  if (!cap.torch) {
    alert('Flashlight not supported on this device.');
    return;
  }
  try {
    torchOn = !torchOn;
    await currentVideoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
  } catch (err) {
    alert('Error toggling flashlight: ' + err.message);
  }
}

// Turn off flashlight (if on)
async function turnOffFlashlight() {
  if (currentVideoTrack && torchOn) {
    try {
      await currentVideoTrack.applyConstraints({ advanced: [{ torch: false }] });
      torchOn = false;
    } catch (err) {
      console.error('Error turning off flashlight:', err);
    }
  }
}

// Hold-to-capture logic
holdBtn.onmousedown = () => {
  const sec = parseInt(holdDurationInput.value) || 3;
  holdTimeout = setTimeout(() => {
    showPreview();
  }, sec * 1000);
};
holdBtn.onmouseup = () => {
  clearTimeout(holdTimeout);
  holdTimeout = null;
};
holdBtn.ontouchstart = () => {
  const sec = parseInt(holdDurationInput.value) || 3;
  holdTimeout = setTimeout(() => {
    showPreview();
  }, sec * 1000);
};
holdBtn.ontouchend = () => {
  clearTimeout(holdTimeout);
  holdTimeout = null;
};

// Show static preview
function showPreview() {
  if (!stream) {
    alert('Start camera first');
    return;
  }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  previewImg.src = canvas.toDataURL('image/png');
  overlay.style.display = 'flex';

  // Turn off flashlight if active
  if (torchOn) turnOffFlashlight();
}

// Show live camera preview (snapshot)
function showLivePreview() {
  if (!stream) {
    alert('Start camera first');
    return;
  }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  previewImg.src = canvas.toDataURL('image/png');
  overlay.style.display = 'flex';

  if (torchOn) turnOffFlashlight();
}

// Download PNG
downloadBtn.onclick = () => {
  const dataUrl = previewImg.src;
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = `preview_${Date.now()}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};

// Close preview overlay
closeBtn.onclick = () => { overlay.style.display = 'none'; };

// Event listeners
startBtn.onclick = startCamera;
stopBtn.onclick = stopCamera;
switchBtn.onclick = switchCamera;
flashlightBtn.onclick = toggleFlashlight;
previewCameraBtn.onclick = showLivePreview;

// Validate hold duration input to accept only numbers
holdDurationInput.oninput = () => {
  holdDurationInput.value = holdDurationInput.value.replace(/\D/g, '');
};
</script>

</body>
</html>
