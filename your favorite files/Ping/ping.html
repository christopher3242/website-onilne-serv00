<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Network Tests & Monitoring</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #f0f0f0;
        font-size: 16px;
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
        font-size: 2em;
        color: #333;
    }

    .button-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 10px;
        gap: 10px;
        max-width: 1000px;
        width: 100%;
    }

    button {
        padding: 10px 15px;
        min-width: 150px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background: #007bff;
        color: white;
        font-weight: bold;
        transition: background 0.3s, transform 0.2s;
    }

    button:hover {
        background: #0056b3;
        transform: scale(1.05);
    }

    #statusMessage {
        margin-top: 15px;
        font-size: 1em;
        color: #555;
        min-height: 20px;
    }

    /* Monitoring display styles */
    #monitorSection {
        margin-top: 30px;
        width: 90%;
        max-width: 600px;
        padding: 15px;
        background: #a8a8a8;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
        display: none; /* Hidden by default */
        text-align: center;
    }

    #latencyDisplay {
        font-size: 2.5em;
        font-weight: bold;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        background: #fcf8f5;
        transition: background-color 0.5s, color 0.5s, transform 0.2s;
        display: inline-block;
        min-width: 100px;
    }

    /* Color states based on latency */
    .good {
        background-color: #28a745; /* Green */
        color: #63ff54;
        transform: scale(1.05);
    }

    .moderate {
        background-color: #ffc107; /* Yellow */
        color: #f57023;
    }

    .poor {
        background-color: #dc3545; /* Red */
        color: #ff0000;
    }
</style>
</head>
<body>
<h1>Network Connectivity & Monitoring</h1>

<div class="button-container">
    <button onclick="performTest('ping')">Ping Test</button>
    <button onclick="performTest('ethernet')">Ethernet Ping</button>
    <button onclick="performTest('wifi')">Wi-Fi Test</button>
    <button onclick="performTest('vpn')">VPN Status</button>
    <button onclick="fetchPublicIP()">Get Public IP</button>
    <button onclick="simulateMobileData()">Mobile Data Speed</button>
    <button onclick="testInternetSpeed()">Internet Speed</button>
    <button onclick="performStabilityTest()">Stability Test</button>
    <button onclick="startMonitoring()">Start Latency Monitor</button>
    <button onclick="stopMonitoring()">Stop Monitoring</button>
    <a href="../../your%20favorite.html"><button>Exit</button></a>
    <button onclick="clearResults()">Clear All</button>
</div>

<div id="statusMessage"></div>

<!-- Monitoring section -->
<div id="monitorSection">
    <h2>Latency Monitoring</h2>
    <div id="latencyDisplay">-- ms</div>
</div>

<script>
const testEndpoints = {
    ping: 'https://www.google.com/favicon.ico',
    ethernet: 'https://www.google.com/favicon.ico',
    wifi: 'https://www.google.com/favicon.ico',
    speedTestImage: 'https://via.placeholder.com/1000x1000.png'
};

// Utility: show status message
function showStatus(message, isError=false) {
    const statusDiv = document.getElementById('statusMessage');
    statusDiv.innerText = message;
    statusDiv.style.color = isError ? 'red' : '#555';
}

// General latency measurement
async function measureLatency() {
    const url = testEndpoints.ping;
    const startTime = performance.now();
    try {
        await fetch(url, { mode: 'no-cors', cache: 'no-store' });
        const endTime = performance.now();
        return endTime - startTime;
    } catch (err) {
        return null;
    }
}

// Perform different tests
async function performTest(type) {
    showStatus('Testing...');
    let resultText = '';
    const latency = await measureLatency();
    if (latency === null) {
        resultText = 'Test failed.';
        showStatus(resultText, true);
        return;
    }

    switch(type) {
        case 'ping':
            resultText = `Ping: ${latency.toFixed(1)} ms`;
            break;
        case 'ethernet':
            resultText = `Ethernet Ping: ${latency.toFixed(1)} ms`;
            break;
        case 'wifi':
            resultText = `Wi-Fi Test: ${latency.toFixed(1)} ms`;
            break;
        case 'vpn':
            // Placeholder for real VPN detection
            resultText = `VPN/Public IP: ${await fetchPublicIP()}`;
            break;
        default:
            resultText = 'Unknown test.';
    }
    showStatus(resultText);
}

// Fetch Public IP
async function fetchPublicIP() {
    try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        document.getElementById('result')?.remove(); // optional: remove previous result
        document.querySelector('.result')?.remove();
        return data.ip;
    } catch {
        showStatus('Failed to fetch public IP.', true);
        return '';
    }
}

// Mobile Data Speed (simulate with image download)
async function simulateMobileData() {
    showStatus('Testing mobile data...');
    const sizeBytes = 1000000; // approx size of image
    const startTime = performance.now();
    try {
        const response = await fetch(testEndpoints.speedTestImage);
        await response.blob();
        const endTime = performance.now();
        const durationSec = (endTime - startTime) / 1000;
        const speedMbps = (sizeBytes * 8) / (durationSec * 1e6);
        showStatus(`Mobile Data Speed: ${speedMbps.toFixed(2)} Mbps`);
    } catch {
        showStatus('Mobile Data Test failed.', true);
    }
}

// Internet Speed Test
async function testInternetSpeed() {
    showStatus('Testing internet speed...');
    const sizeBytes = 500000; // 500 KB
    const startTime = performance.now();
    try {
        await fetch(testEndpoints.speedTestImage);
        const endTime = performance.now();
        const durationSec = (endTime - startTime) / 1000;
        const speedMbps = (sizeBytes * 8) / (durationSec * 1e6);
        showStatus(`Speed: ${speedMbps.toFixed(2)} Mbps`);
    } catch {
        showStatus('Speed test failed.', true);
    }
}

// Stability Test (multiple latency checks)
async function performStabilityTest() {
    showStatus('Running stability test...');
    const attempts = 10;
    let latencies = [];
    for (let i=0; i<attempts; i++) {
        const latency = await measureLatency();
        if (latency !== null) latencies.push(latency);
        await new Promise(res => setTimeout(res, 300));
    }
    if (latencies.length === 0) {
        showStatus('Failed to get latency responses.', true);
        return;
    }
    const sum = latencies.reduce((a,b) => a+b, 0);
    const avg = sum / latencies.length;
    const max = Math.max(...latencies);
    const min = Math.min(...latencies);
    const stabilityMsg = (max - min < 50 && avg < 100)
        ? `Your connection is stable.\nAvg Latency: ${avg.toFixed(1)} ms\nMax: ${max.toFixed(1)} ms, Min: ${min.toFixed(1)} ms`
        : `Your connection is unstable.\nAvg Latency: ${avg.toFixed(1)} ms\nMax: ${max.toFixed(1)} ms, Min: ${min.toFixed(1)} ms`;
    showStatus(stabilityMsg);
}

// Monitoring
let monitorInterval = null;

function startMonitoring() {
    document.getElementById('monitorSection').style.display = 'block';
    if (monitorInterval) clearInterval(monitorInterval);
    monitorInterval = setInterval(async () => {
        const latency = await measureLatency();
        updateLatencyDisplay(latency);
    }, 1000);
    showStatus('Latency monitoring started.');
}

function stopMonitoring() {
    if (monitorInterval) {
        clearInterval(monitorInterval);
        monitorInterval = null;
        showStatus('Latency monitoring stopped.');
    }
    document.getElementById('latencyDisplay').innerText = '-- ms';
    document.getElementById('latencyDisplay').className = '';
    document.getElementById('monitorSection').style.display = 'none';
}

function updateLatencyDisplay(latency) {
    const display = document.getElementById('latencyDisplay');
    if (latency === null) {
        display.innerText = 'Error';
        display.className = '';
        return;
    }
    display.innerText = latency.toFixed(1) + ' ms';

    display.className = '';
    if (latency < 50) {
        display.classList.add('good');
    } else if (latency < 100) {
        display.classList.add('moderate');
    } else {
        display.classList.add('poor');
    }
}

function clearResults() {
    document.getElementById('statusMessage').innerText = '';
}
</script>
</body>
</html>
