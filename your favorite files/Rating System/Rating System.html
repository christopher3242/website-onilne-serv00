<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rating System with Color Zones</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #f0f8ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }

  h1 {
    margin-bottom: 15px;
    color: #2c3e50;
    text-align: center;
  }

  #controls {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .button {
    font-size: 1.5em;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background-color: #007bff;
    color: #fff;
    transition: background-color 0.3s, transform 0.2s;
  }

  .button:hover,
  .button:focus {
    background-color: #0056b3;
    outline: none;
    transform: scale(1.05);
  }

  #exitButton {
    background-color: #dc3545;
  }

  #exitButton:hover,
  #exitButton:focus {
    background-color: #a71d2a;
  }

  #rateDisplay {
    font-size: 2em;
    padding: 15px;
    border-radius: 8px;
    width: 180px;
    text-align: center;
    color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    margin-bottom: 15px;
    transition: background-color 0.3s;
  }

  #rateInput {
    width: 120px;
    padding: 8px;
    font-size: 1.2em;
    border-radius: 6px;
    border: 1px solid #ccc;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
  }

  #rateInput:focus {
    border-color: #007bff;
    box-shadow: 0 0 5px rgba(0,123,255,0.5);
  }

  /* Responsive adjustments */
  @media(max-width: 500px) {
    .button {
      font-size: 1.2em;
      padding: 10px 20px;
    }
    #rateDisplay {
      font-size: 1.5em;
      width: 150px;
    }
    #rateInput {
      width: 100px;
      font-size: 1em;
    }
  }
</style>
</head>
<body>

<h1>Rating System with Color Zones</h1>

<div id="controls">
  <button class="button" onclick="changeRate(-0.5)">−</button>
  <button class="button" onclick="changeRate(0.5)">+</button>
  <a href="../../your%20favorite.html" style="text-decoration: none;">
    <button class="button" id="exitButton" onclick="exit()">Exit</button>
  </a>
</div>

<div id="rateDisplay">0.00</div>
<input type="number" id="rateInput" value="0" step="0.01" />

<script>
  let rate = 0;
  const MIN = -9999999;
  const MAX = 9999999;

  const rateDisplay = document.getElementById('rateDisplay');
  const rateInput = document.getElementById('rateInput');

  function updateDisplay() {
    // Clamp rate to limits
    rate = Math.max(MIN, Math.min(rate, MAX));
    
    // Show formatted rate
    rateDisplay.textContent = rate.toFixed(2);
    rateInput.value = rate.toFixed(2);

    // Apply color zones
    if (rate >= -9999999 && rate <= 4.5) {
      rateDisplay.style.backgroundColor = 'red';
    } else if (rate >= 5 && rate <= 9999999) {
      rateDisplay.style.backgroundColor = 'green';
    } else {
      rateDisplay.style.backgroundColor = '#333'; // fallback
    }
  }

  function changeRate(delta) {
    if (rate + delta >= MIN && rate + delta <= MAX) {
      rate += delta;
      updateDisplay();
    }
  }

  // Manual input handler
  rateInput.addEventListener('change', () => {
    const val = parseFloat(rateInput.value);
    if (!isNaN(val) && val >= MIN && val <= MAX) {
      rate = val;
      updateDisplay();
    } else {
      // Reset invalid input
      rateInput.value = rate.toFixed(2);
    }
  });

  // Optional: Press Enter to update
  rateInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      rateInput.blur(); // Trigger change event
    }
  });

  // Initialize display
  updateDisplay();

  function exit() {
    window.location.href = "../../your%20favorite.html";
  }
</script>
</body>
</html>
