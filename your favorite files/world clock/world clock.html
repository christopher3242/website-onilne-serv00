<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stylish World Clock</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="container">
  <h1>World Clock with DST Adjustment</h1>
  <div id="clock" class="clock">
    <h2 id="cityName"></h2>
    <div id="time" class="time"></div>
    <p id="dstStatus" class="dst-status" aria-live="polite"></p>
    <p class="local-clock-label">Your local time</p>
    <div id="localTime" class="local-time"></div>
  </div>
  <label class="search-label" for="zoneSearch">Search a city</label>
  <input id="zoneSearch" class="zone-search" type="search" list="timeZoneOptions" placeholder="Type a city name..." autocomplete="off" />
  <datalist id="timeZoneOptions"></datalist>
  <div class="buttons">
    <button onclick="previousTimeZone()">Previous</button>
    <button onclick="nextTimeZone()">Next</button>
    <button id="formatBtn" onclick="toggleTimeFormat()">Switch to 24-Hour</button>
  </div>
  <a href="../../your%20favorite.html">
    <button class="exit-button" id="exitBtn" onclick="exitPage()">Exit</button>
  </a>
</div>

<script src="script.js"></script>
</body>
</html>
