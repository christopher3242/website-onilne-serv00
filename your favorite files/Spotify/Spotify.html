<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>My Spotify Playlists</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(16px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(145deg, #191414, #343434);
    }

    .page {
      width: 100%;
      max-width: 1100px;
    }

    .top-bar {
      margin-bottom: 24px;
    }

    .exit-button {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 999px;
      background: #1db954;
      color: #fff;
      font-weight: bold;
      text-decoration: none;
    }

    .exit-button:hover {
      background: #14833b;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
    }

    .intro {
      margin: 0 0 22px;
      color: #d0d0d0;
      text-align: center;
      line-height: 1.5;
    }

    #playlistSearch {
      display: block;
      width: min(100%, 400px);
      margin: 0 auto 20px;
      padding: 12px 16px;
      border: 1px solid #777;
      border-radius: 999px;
      background: #222;
      color: #fff;
      font-size: 16px;
    }

    #playlistSearch::placeholder {
      color: #bbb;
    }

    .playlist-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .playlist-controls button {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: #1db954;
      color: white;
      font-size: 26px;
      cursor: pointer;
    }

    .playlist-controls button:hover {
      background: #14833b;
    }

    #playlistLabel {
      min-width: 100px;
      text-align: center;
      font-weight: bold;
    }

    .playlist-grid {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    .playlist-card {
      overflow: hidden;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .playlist-card[hidden] {
      display: none;
    }

    .playlist-card h2 {
      margin: 4px 4px 12px;
      font-size: 1.1rem;
    }

    iframe {
      display: block;
      width: 100%;
      height: 500px;
      border: 0;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .top-bar {
        margin-bottom: 20px;
      }

      iframe {
        height: 352px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="top-bar">
      <a class="exit-button" href="../../your%20favorite.html" aria-label="Exit to main page">
        Exit
      </a>
    </div>

    <h1>My Spotify Playlists</h1>
    <p class="intro">Listen to my playlists below.</p>

    <input
      id="playlistSearch"
      type="search"
      placeholder="Search playlists"
      aria-label="Search playlists"
    />

    <div class="playlist-controls" aria-label="Choose a playlist">
      <button type="button" id="prevPlaylist" aria-label="Previous playlist">&lt;</button>
      <span id="playlistLabel">Playlist 1</span>
      <button type="button" id="nextPlaylist" aria-label="Next playlist">&gt;</button>
    </div>

    <section class="playlist-grid" aria-label="Spotify playlists">
      <article class="playlist-card">
        <h2>Playlist 1</h2>
        <iframe
          src="https://open.spotify.com/embed/playlist/3LFosqFZ17J0kNQvVul3NU"
          title="Spotify Playlist 1"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy"
        ></iframe>
      </article>

      <article class="playlist-card" hidden>
        <h2>Playlist 2</h2>
        <iframe
          src="https://open.spotify.com/embed/playlist/17zWdcUx1mRc4a4kWrKqD1?utm_source=generator&si=f55afb82fe5d43c0"
          title="Spotify Playlist 2"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy"
        ></iframe>
      </article>
    </section>
  </main>

  <script>
    const playlists = [...document.querySelectorAll(".playlist-card")];
    const label = document.getElementById("playlistLabel");
    const search = document.getElementById("playlistSearch");
    let current = 0;

    function showPlaylist(index) {
      current = (index + playlists.length) % playlists.length;

      playlists.forEach((playlist, i) => {
        playlist.hidden = i !== current;
        playlist.style.display = "";
      });

      const name = `Playlist ${current + 1}`;
      label.textContent = name;
      search.placeholder = `Search ${name}`;
      search.value = "";
    }

    document.getElementById("prevPlaylist").addEventListener("click", () => {
      showPlaylist(current - 1);
    });

    document.getElementById("nextPlaylist").addEventListener("click", () => {
      showPlaylist(current + 1);
    });

    search.addEventListener("input", () => {
      const query = search.value.trim().toLowerCase();
      let firstMatch = -1;

      playlists.forEach((playlist, index) => {
        const title = playlist.querySelector("h2").textContent.toLowerCase();
        const matches = !query || title.includes(query);
        playlist.hidden = !matches;

        if (matches && firstMatch === -1) {
          firstMatch = index;
        }
      });

      if (firstMatch === -1) {
        label.textContent = "No playlists found";
      } else {
        current = firstMatch;
        label.textContent = `Playlist ${current + 1}`;
      }
    });

    showPlaylist(0);
  </script>
</body>
</html>
