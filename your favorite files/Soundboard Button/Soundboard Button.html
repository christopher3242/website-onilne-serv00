<!DOCTYPE html>

  <title>Soundboard</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #4396bd;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px;
    }

    /* Exit Button */
    .exit-link {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
    }
    .exit-link button {
      background-color: rgb(255, 94, 94);
      color: white;
      border: 2px solid white;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.3s, transform 0.2s;
    }
    .exit-link button:hover,
    .exit-link button:focus {
      background-color: rgb(30, 30, 30);
      outline: none;
      transform: translateY(-2px);
    }

    h1 {
      margin-top: 60px;
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    /* Soundboard grid layout */
    .soundboard {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    /* Each iframe container for better control */
    .sound-item {
      flex: 1 1 110px;
      max-width: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    iframe {
      border: none;
      width: 110px;
      height: 200px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    iframe:hover,
    iframe:focus {
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      outline: none;
    }

    /* Responsive adjustments */
    @media(max-width: 600px) {
      h1 {
        font-size: 2em;
      }
      iframe {
        width: 100px;
        height: 150px;
      }
    }
  </style>
</head>
