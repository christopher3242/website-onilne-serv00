<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Centered Notes App</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    background-color: #a8a8a8;
  }
  .container {
    background: #fff;
    padding: 20px;
    margin-top: 50px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    width: 90%;
    max-width: 600px;
  }
  h2 {
    text-align: center;
    margin-top: 0;
  }
  #notes {
    width: 100%;
    height: 200px;
    padding: 10px;
    border: 1px solid #ccc;
    resize: none;
    box-sizing: border-box;
    font-family: monospace;
    font-size: 14px;
  }
  .controls {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: space-between;
  }
  select, button {
    padding: 8px 12px;
    font-size: 14px;
    cursor: pointer;
  }
  #dropZone {
    margin-top: 15px;
    padding: 20px;
    border: 2px dashed #999;
    border-radius: 8px;
    text-align: center;
    color: #555;
    font-size: 14px;
    cursor: pointer;
    background-color: #f9f9f9;
    transition: background-color 0.2s, border-color 0.2s;
  }
  #dropZone.hover {
    border-color: #333;
    background-color: #eef;
  }
</style>
</head>
<body>
<div class="container">
  <h2>Notes</h2>
  <!-- Textarea for notes -->
  <textarea id="notes" placeholder="Write your notes here..."></textarea>
  <!-- Background color selector -->
  <div style="margin-top:10px;">
    <label for="bgColor">Background Color:</label>
    <select id="bgColor">
      <option value="" selected>Select color</option>
      <option value="#ffffff">White</option>
      <option value="#f8d7da">Light Red</option>
      <option value="#d4edda">Light Green</option>
      <option value="#d1ecf1">Light Blue</option>
      <option value="#fff3cd">Light Yellow</option>
      <option value="#ffe4e1">Misty Rose</option>
      <option value="#e0ffff">Light Cyan</option>
      <option value="#f0e68c">Khaki</option>
      <option value="#dda0dd">Plum</option>
      <option value="#ffe4b5">Moccasin</option>
      <option value="#d2b48c">Tan</option>
      <option value="#add8e6">Light Blue</option>
      <option value="#90ee90">Light Green</option>
      <option value="#ffb6c1">Light Pink</option>
      <option value="#fa8072">Salmon</option>
      <option value="#f5f5dc">Beige</option>
      <option value="#e6e6fa">Lavender</option>
      <option value="#bcf5bc">Mint Green</option>
      <option value="#ffd700">Gold</option>
      <option value="#2f4f4f">Coal</option>
      <option value="#000000">Black</option>
      <option value="#708090">Slate Gray</option>
      <option value="#556b2f">Dark Olive Green</option>
      <option value="#4b0082">Indigo</option>
      <option value="#8b0000">Dark Red</option>
      <option value="#006400">Dark Green</option>
      <option value="#8b4513">Saddle Brown</option>
      <option value="#483d8b">Dark Slate Blue</option>
      <option value="#696969">Dim Gray</option>
      <!-- Add more if desired -->
    </select>
  </div>
  <!-- Buttons: Clear, Save, Exit -->
  <div class="controls">
    <button onclick="clearNotes()">Clear</button>
    <button onclick="saveNotes()">Save</button>
    <a href="../../your%20favorite.html"><button onclick="exitEditor()">Exit</button></a>
  </div>
  <!-- Drag & Drop area -->
  <div id="dropZone">Drag & Drop a .txt file here to load notes</div>
  <!-- Load file input -->
  <div style="margin-top:10px; text-align:center;">
    <input type="file" id="loadFile" accept=".txt" style="display:none" />
    <button onclick="document.getElementById('loadFile').click()">Load File</button>
  </div>
</div>
<script>
  const notes = document.getElementById('notes');
  const bgSelect = document.getElementById('bgColor');
  const loadInput = document.getElementById('loadFile');
  const dropZone = document.getElementById('dropZone');

  // Initialize background color from local storage or default
  window.onload = () => {
    const savedNotes = localStorage.getItem('notes');
    if (savedNotes) {
      notes.value = savedNotes;
    }
    const savedColor = localStorage.getItem('bgColor');
    if (savedColor) {
      notes.style.backgroundColor = savedColor;
      bgSelect.value = savedColor;
    } else {
      // Optional: random or default color
      notes.style.backgroundColor = '';
    }
  };

  // Change background color
  bgSelect.addEventListener('change', () => {
    const color = bgSelect.value;
    notes.style.backgroundColor = color;
    localStorage.setItem('bgColor', color);
  });

  // Clear notes
  function clearNotes() {
    notes.value = '';
  }

  // Save notes
  function saveNotes() {
    localStorage.setItem('notes', notes.value);
    alert('Notes saved!');
  }

  // Load notes from file
  function loadNotes() {
    const file = loadInput.files[0];
    if (file && file.name.endsWith('.txt')) {
      const reader = new FileReader();
      reader.onload = e => {
        notes.value = e.target.result;
        localStorage.setItem('notes', notes.value);
      };
      reader.readAsText(file);
    } else {
      alert('Please select a valid .txt file.');
    }
  }

  // Drag & Drop
  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('hover');
  });
  dropZone.addEventListener('dragleave', e => {
    e.preventDefault();
    dropZone.classList.remove('hover');
  });
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('hover');
    const files = e.dataTransfer.files;
    if (files.length && files[0].name.endsWith('.txt')) {
      const reader = new FileReader();
      reader.onload = e => {
        notes.value = e.target.result;
        localStorage.setItem('notes', notes.value);
      };
      reader.readAsText(files[0]);
    } else {
      alert('Please drop a .txt file.');
    }
  });
  // Clicking drop zone opens file dialog
  dropZone.addEventListener('click', () => {
    document.getElementById('loadFile').click();
  });
</script>
</body>
</html>
