<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Before and After Image Slider</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f0f0f0;
  }

  /* Fixed header */
  header {
    position: fixed;
    top: 0;
    width: 100%;
    background-color: #333;
    color: #fff;
    padding: 15px 20px;
    text-align: center;
    z-index: 1000;
  }

  /* Exit button styling */
  #exit {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 8px 16px;
    background-color: #ff5c5c;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    z-index: 1001;
    font-size: 14px;
  }
  #exit:hover {
    background-color: #ff1c1c;
  }

  /* Slider container, offset for fixed header */
  .slider-container {
    position: relative;
    width: 90%;
    max-width: 800px;
    height: 500px;
    margin: 100px auto 50px auto;
    border: 2px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    background-color: #fff;
  }

  .image-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* Images styling */
  .image-wrapper img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Overlay clip for the 'after' image */
  .after-image {
    clip-path: inset(0 50% 0 0);
    transition: clip-path 0.2s ease;
  }

  /* Slider handle */
  .slider {
    position: absolute;
    top: 0;
    left: 50%;
    width: 4px;
    height: 100%;
    background: #fff;
    cursor: ew-resize;
    z-index: 10;
    transform: translateX(-50%);
    transition: background-color 0.2s;
  }

  /* Handle circle for better UX */
  .handle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 24px;
    height: 24px;
    background: #fff;
    border: 3px solid #333;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: box-shadow 0.2s, transform 0.2s;
  }

  .handle:hover {
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transform: scale(1.1);
  }

  /* Header text style */
  h1 {
    margin: 0;
    font-size: 24px;
  }

  /* Responsive adjustments */
  @media(max-width: 600px) {
    .slider-container {
      height: 350px;
    }
    .handle {
      width: 20px;
      height: 20px;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Before and After Slider</h1>
</header>

<!-- Exit Button -->
<a href="../../your%20favorite.html">
  <button id="exit">Exit</button>
</a>

<!-- Slider Container -->
<div class="slider-container" id="slider">
  <div class="image-wrapper">
    <img src="https://file.garden/Zyu3f9V1JUxg3Fw-/webiste%20%20onilne%20(Github)/Before%20and%20After%20Slider/christopher%20avatar.jpg" alt="Before Image" />
    <img src="https://file.garden/Zyu3f9V1JUxg3Fw-/webiste%20%20onilne%20(Github)/Before%20and%20After%20Slider/before.jpg" alt="After Image" class="after-image" id="afterImage" />
  </div>
  <div class="slider" id="sliderHandle"></div>
  <div class="handle" id="handleCircle" tabindex="0" aria-label="Drag slider"></div>
</div>

<script>
  const slider = document.getElementById('slider');
  const afterImage = document.getElementById('afterImage');
  const handle = document.getElementById('sliderHandle');
  const handleCircle = document.getElementById('handleCircle');

  let isDragging = false;

  // Function to update clip based on X coordinate
  const updateClip = (x) => {
    const rect = slider.getBoundingClientRect();
    let offsetX = x - rect.left;
    offsetX = Math.max(0, Math.min(offsetX, rect.width));
    const clipPercent = (offsetX / rect.width) * 100;

    // Update clip-path for 'after' image
    afterImage.style.clipPath = `inset(0 ${100 - clipPercent}% 0 0)`;

    // Position handle and circle
    handle.style.left = `${offsetX}px`;
    handleCircle.style.left = `${offsetX}px`;
  };

  // Mouse events
  handle.addEventListener('mousedown', () => { isDragging = true; });
  document.addEventListener('mouseup', () => { isDragging = false; });
  document.addEventListener('mouseleave', () => { isDragging = false; });
  document.addEventListener('mousemove', (e) => {
    if (isDragging) {
      updateClip(e.clientX);
    }
  });

  // Touch events
  handle.addEventListener('touchstart', () => { isDragging = true; });
  document.addEventListener('touchend', () => { isDragging = false; });
  document.addEventListener('touchcancel', () => { isDragging = false; });
  document.addEventListener('touchmove', (e) => {
    if (isDragging && e.touches.length === 1) {
      updateClip(e.touches[0].clientX);
    }
  });

  // Clicking anywhere within slider moves handle
  slider.addEventListener('click', (e) => {
    updateClip(e.clientX);
  });

  // Initialize handle position on window load
  window.addEventListener('load', () => {
    const rect = slider.getBoundingClientRect();
    updateClip(rect.left + rect.width / 2);
  });
</script>

</body>
</html>
