<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analog and Digital Clock</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --accent: #2e8b57;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #101512;
      color: #fff;
      font-family: "Segoe UI", sans-serif;
    }

    h1 {
      margin: 0;
      text-align: center;
    }

    .clock-face {
      position: relative;
      width: min(78vw, 420px);
      aspect-ratio: 1;
      border: 4px solid var(--accent);
      border-radius: 50%;
      background: radial-gradient(circle, #202923 0 68%, #121a15 69% 100%);
      box-shadow: 0 15px 30px #0008, inset 0 0 24px #0008, 0 0 24px #2e8b5766;
    }

    .clock-face::before {
      content: "";
      position: absolute;
      z-index: 5;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--accent);
      transform: translate(-50%, -50%);
    }

    .mark {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 44%;
      transform: translate(-50%, -50%) rotate(var(--angle));
    }

    .mark::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 9px;
      border-radius: 2px;
      background: #b9d6c4;
    }

    .mark.major::before {
      width: 4px;
      height: 14px;
      left: -1px;
      background: #fff;
    }

    .numeral {
      position: absolute;
      z-index: 2;
      color: #fff;
      font-size: clamp(18px, 5vw, 25px);
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 1px 4px #000;
    }

    .numeral-12 {
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
    }

    .numeral-3 {
      top: 50%;
      right: 8%;
      transform: translateY(-50%);
    }

    .numeral-6 {
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
    }

    .numeral-9 {
      top: 50%;
      left: 8%;
      transform: translateY(-50%);
    }

    .hand {
      position: absolute;
      z-index: 3;
      bottom: 50%;
      left: 50%;
      border-radius: 999px;
      transform: translateX(-50%) rotate(0deg);
      transform-origin: 50% 100%;
    }

    .hour-hand {
      width: 8px;
      height: 25%;
      background: var(--accent);
    }

    .minute-hand {
      width: 5px;
      height: 34%;
      background: #fff;
    }

    .second-hand {
      z-index: 4;
      width: 2px;
      height: 39%;
      background: #fc2856;
    }

    .digital-clock {
      width: min(100%, 410px);
      padding: 18px 12px;
      border: 2px solid var(--accent);
      border-radius: 8px;
      background: #176b43;
      text-align: center;
      box-shadow: 0 0 24px #2e8b5766;
    }

    .date {
      margin-bottom: 8px;
      font-size: clamp(15px, 4vw, 20px);
      font-weight: 600;
      letter-spacing: 2px;
    }

    .time {
      display: flex;
      justify-content: center;
      align-items: baseline;
      white-space: nowrap;
      font-size: clamp(38px, 12vw, 60px);
      font-weight: 600;
      letter-spacing: 2px;
    }

    .period {
      margin-left: 8px;
      font-size: 0.45em;
      letter-spacing: 0;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      padding: 10px 16px;
      border: 2px solid #398af3;
      border-radius: 8px;
      background: #202923;
      color: white;
      font: inherit;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    button:hover,
    button[aria-pressed="true"] {
      border-color: var(--accent);
      background: #176b43;
    }

    .color-control {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid #ffffff55;
      border-radius: 8px;
      background: #202923;
      font-size: 14px;
    }

    .color-control input {
      width: 38px;
      height: 32px;
      padding: 2px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    #rgbValue {
      color: #d8e8de;
      font-variant-numeric: tabular-nums;
    }

    .exit-container {
      margin-top: 20px;
    }

    .exit-link {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 4px;
      background-color: #333;
      color: white;
      font-size: 1.2em;
      text-decoration: none;
    }

    .exit-link:hover {
      background-color: #444;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 450px) {
      body {
        gap: 18px;
        padding: 18px;
      }

      .clock-face {
        width: min(82vw, 330px);
      }
    }
  </style>
</head>
<body>
  <h1>Analog Clock</h1>

  <section class="clock-face" id="analogClock" role="img" aria-label="Analog clock" hidden>
    <span class="mark major" style="--angle: 0deg"></span>
    <span class="mark" style="--angle: 30deg"></span>
    <span class="mark" style="--angle: 60deg"></span>
    <span class="mark major" style="--angle: 90deg"></span>
    <span class="mark" style="--angle: 120deg"></span>
    <span class="mark" style="--angle: 150deg"></span>
    <span class="mark major" style="--angle: 180deg"></span>
    <span class="mark" style="--angle: 210deg"></span>
    <span class="mark" style="--angle: 240deg"></span>
    <span class="mark major" style="--angle: 270deg"></span>
    <span class="mark" style="--angle: 300deg"></span>
    <span class="mark" style="--angle: 330deg"></span>
    <span class="numeral numeral-12">12</span>
    <span class="numeral numeral-3">3</span>
    <span class="numeral numeral-6">6</span>
    <span class="numeral numeral-9">9</span>
    <span class="hand hour-hand" id="hourHand"></span>
    <span class="hand minute-hand" id="minuteHand"></span>
    <span class="hand second-hand" id="secondHand"></span>
  </section>

  <section class="digital-clock" id="digitalClock" aria-label="Digital clock">
    <div class="date">
      <span id="day">Day</span>, <span id="month">Month</span>
      <span id="dateNumber">00</span>, <span id="year">Year</span>
    </div>
    <div class="time" aria-live="off">
      <span id="hour">00</span>:<span id="minute">00</span>:<span id="second">00</span>
      <span class="period" id="period">AM</span>
    </div>
  </section>

  <div class="controls" aria-label="Clock display options">
    <button class="analog-button" type="button" aria-pressed="false">Analog clock</button>
    <button class="digital-button" type="button" aria-pressed="true">Digital clock</button>
    <button class="format-button" type="button" aria-pressed="false">Use 24-hour time</button>
    <button class="save-button" type="button">Save settings</button>
    <button class="load-button" type="button">Load settings</button>
    <label class="color-control" for="accentColor">
      Accent color
      <input id="accentColor" type="color" value="#2e8b57" aria-label="Choose clock accent color" />
      <output id="rgbValue" for="accentColor">RGB (46, 139, 87)</output>
    </label>
    <span id="settingsStatus" role="status" aria-live="polite"></span>
  </div>

  <div class="exit-container">
    <a href="../../your%20favorite.html" class="exit-link">Exit</a>
  </div>

  <script>
    const analogClock = document.getElementById('analogClock');
    const digitalClock = document.getElementById('digitalClock');
    const analogButton = document.querySelector('.analog-button');
    const digitalButton = document.querySelector('.digital-button');
    const formatButton = document.querySelector('.format-button');
    const settingsStatus = document.getElementById('settingsStatus');
    let is24Hour = false;

    function setClockView(view) {
      const showAnalog = view === 'analog';
      analogClock.hidden = !showAnalog;
      digitalClock.hidden = showAnalog;
      analogButton.setAttribute('aria-pressed', String(showAnalog));
      digitalButton.setAttribute('aria-pressed', String(!showAnalog));
    }

    analogButton.addEventListener('click', () => setClockView('analog'));
    digitalButton.addEventListener('click', () => setClockView('digital'));

    const accentColor = document.getElementById('accentColor');
    const rgbValue = document.getElementById('rgbValue');

    function applyAccentColor(hex) {
      accentColor.value = hex;
      const red = parseInt(hex.slice(1, 3), 16);
      const green = parseInt(hex.slice(3, 5), 16);
      const blue = parseInt(hex.slice(5, 7), 16);
      document.documentElement.style.setProperty('--accent', hex);
      rgbValue.textContent = `RGB (${red}, ${green}, ${blue})`;
    }

    accentColor.addEventListener('input', () => applyAccentColor(accentColor.value));

    formatButton.addEventListener('click', () => {
      is24Hour = !is24Hour;
      formatButton.setAttribute('aria-pressed', String(is24Hour));
      formatButton.textContent = is24Hour ? 'Use 12-hour time' : 'Use 24-hour time';
      initClock();
    });

    document.querySelector('.save-button').addEventListener('click', () => {
      const settings = {
        view: analogButton.getAttribute('aria-pressed') === 'true' ? 'analog' : 'digital',
        accent: accentColor.value,
        is24Hour
      };

      try {
        localStorage.setItem('clockSettings', JSON.stringify(settings));
        settingsStatus.textContent = 'Settings saved.';
      } catch {
        settingsStatus.textContent = 'Unable to save settings in this browser.';
      }
    });

    document.querySelector('.load-button').addEventListener('click', () => {
      try {
        const saved = JSON.parse(localStorage.getItem('clockSettings'));
        if (!saved) {
          settingsStatus.textContent = 'No saved settings found.';
          return;
        }

        if (saved.view === 'analog' || saved.view === 'digital') setClockView(saved.view);
        if (typeof saved.accent === 'string' && /^#[0-9a-f]{6}$/i.test(saved.accent)) {
          applyAccentColor(saved.accent);
        }
        if (typeof saved.is24Hour === 'boolean') {
          is24Hour = saved.is24Hour;
          formatButton.setAttribute('aria-pressed', String(is24Hour));
          formatButton.textContent = is24Hour ? 'Use 12-hour time' : 'Use 24-hour time';
        }
        initClock();
        settingsStatus.textContent = 'Settings loaded.';
      } catch {
        settingsStatus.textContent = 'Unable to load saved settings.';
      }
    });

    function initClock() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const twelveHour = hours % 12 || 12;
      const pad = value => String(value).padStart(2, '0');
      const period = document.getElementById('period');

      document.getElementById('hour').textContent = pad(is24Hour ? hours : twelveHour);
      document.getElementById('minute').textContent = pad(minutes);
      document.getElementById('second').textContent = pad(seconds);
      period.textContent = hours >= 12 ? 'PM' : 'AM';
      period.hidden = is24Hour;
      document.getElementById('day').textContent = new Intl.DateTimeFormat(undefined, { weekday: 'long' }).format(now);
      document.getElementById('month').textContent = new Intl.DateTimeFormat(undefined, { month: 'long' }).format(now);
      document.getElementById('dateNumber').textContent = now.getDate();
      document.getElementById('year').textContent = now.getFullYear();

      document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${(hours % 12) * 30 + minutes * 0.5}deg)`;
      document.getElementById('minuteHand').style.transform = `translateX(-50%) rotate(${minutes * 6 + seconds * 0.1}deg)`;
      document.getElementById('secondHand').style.transform = `translateX(-50%) rotate(${seconds * 6}deg)`;
    }

    initClock();
    setInterval(initClock, 1000);
  </script>
</body>
</html>
