<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revolutionary Hosting</title>
<style>
  /* Reset some default styles */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #f0f8ff; /* Light blue background */
    font-family: 'Arial', sans-serif;
    color: #003366; /* Dark blue text */
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background-color: #006699;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  header h1 {
    color: #fff;
    font-size: 2em;
    margin-bottom: 10px;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  table {
    border-collapse: collapse;
    width: 90%;
    max-width: 600px;
    border: 1px solid #3399ff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }

  tbody tr:nth-child(even) {
    background-color: #e6f7ff;
  }

  tbody tr:hover {
    background-color: #d0f0ff;
  }

  td {
    padding: 15px;
    text-align: center;
  }

  a {
    color: #0066cc;
    text-decoration: none;
    font-weight: 600;
  }

  a:hover {
    text-decoration: underline;
  }

  /* Exit Button Styling */
  .exit-button {
    padding: 12px 24px;
    font-size: 1em;
    background: linear-gradient(45deg, #6ec1e4, #3b8ed0);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: background 0.3s, transform 0.2s;
    margin-top: 20px;
    min-width: 150px;
    text-align: center;
    display: inline-block;
  }

  .exit-button:hover {
    background: linear-gradient(45deg, #5ab0e4, #3170b0);
    transform: scale(1.05);
  }

  /* Container for button */
  .button-container {
    margin-top: 20px;
  }

  /* Responsive adjustments */
  @media(max-width: 600px) {
    header h1 {
      font-size: 1.5em;
    }
    .exit-button {
      width: 100%;
      max-width: 200px;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Revolutionary Hosting</h1>
</header>

<main>
  <table>
    <tbody>
      <tr>
        <td><a href="https://1freehosting.com/" target="_blank" rel="noopener noreferrer">https://1freehosting.com/</a></td>
      </tr>
      <tr>
        <td><a href="https://themeisle.com/blog/best-free-website-hosting/#gref" target="_blank" rel="noopener noreferrer">https://themeisle.com/blog/best-free-website-hosting/#gref</a></td>
      </tr>
      <tr>
        <td><a href="http://revolutiondiscs.runhosting.com/free-web-hosting.html" target="_blank" rel="noopener noreferrer">http://revolutiondiscs.runhosting.com/free-web-hosting.html</a></td>
      </tr>
    </tbody>
  </table>

  <div class="button-container">
    <a href="../../your%20favorite.html" style="text-decoration:none;">
      <button class="exit-button">Exit</button>
    </a>
  </div>
</main>

</body>
</html>
