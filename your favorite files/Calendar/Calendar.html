<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendar with Schedule &amp; Edit</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background-color: #054b8d;
    color: #fff;
    margin: 0;
  }
  h1 {
    text-align: center;
    margin-bottom: 15px;
    font-size: 1.8em;
  }
  #currentTime {
    text-align: center;
    font-size: 1.2em;
    margin-bottom: 15px;
  }
  #topControls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  #controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  select, button {
    margin: 5px;
    padding: 8px 12px;
    font-size: 1em;
    border-radius: 4px;
    border: none;
    cursor: pointer;
  }
  button {
    background-color: #4CAF50;
    color: white;
    transition: background-color 0.2s;
  }
  button:hover {
    background-color: #45a049;
  }
  #exitBtn {
    background-color: #f44336;
  }
  #calendar {
    max-width: 95%;
    margin: 20px auto;
    background-color: rgba(255,255,255,0.2);
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
  }
  th {
    background-color: #4CAF50;
    color: white;
    padding: 10px 0;
    text-align: center;
    font-size: 1em;
  }
  td {
    border: 1px solid #ddd;
    height: 100px;
    vertical-align: top;
    padding: 5px;
    background-color: #fff;
    color: #000;
    font-size: 0.9em;
    position: relative;
  }
  /* Highlight today's date */
  .today {
    font-weight: bold;
    background-color: #ffffcc;
  }
  /* Indicators inside date cells */
  td div {
    margin: 2px 0;
  }
  /* Schedule section styles */
  #schedule {
    margin-top: 20px;
  }
  #schedule h2, #schedule h3 {
    margin-bottom: 8px;
  }
  #scheduleList {
    list-style: none;
    padding: 0;
    margin: 0 0 20px 0;
  }
  #scheduleList li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px;
    border-bottom: 1px solid #ccc;
    background-color: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    flex-wrap: wrap;
  }
  .task-info {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
  }
  .circle {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
  }
  .actionBtns button {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 0.9em;
    margin-left: 8px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: background-color 0.2s;
  }
  .actionBtns button:hover {
    background-color: rgba(255,255,255,0.2);
  }
  /* Add task form styles */
  #addTaskForm {
    display: flex;
    flex-direction: column;
    max-width: 400px;
    margin: 10px auto 0 auto;
  }
  #addTaskForm label {
    margin-bottom: 4px;
    font-weight: bold;
  }
  #addTaskForm input, #addTaskForm textarea {
    margin-bottom: 10px;
    padding: 8px;
    border-radius: 4px;
    border: 1px solid #ccc;
    font-size: 1em;
  }
  #addTaskForm button {
    align-self: flex-start;
    padding: 8px 16px;
    font-size: 1em;
    border: none;
    border-radius: 4px;
    background-color: #4CAF50;
    color: white;
    cursor: pointer;
  }
  #addTaskForm button:hover {
    background-color: #45a049;
  }
  /* Overlay for editing */
  #editOverlay {
    position: fixed;
    top: 0; left: 0; right:0; bottom:0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items:center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }
  #editFormContainer {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
  }
  #editForm label {
    display: block;
    margin-bottom: 4px;
    font-weight: bold;
  }
  #editForm input, #editForm textarea {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 10px;
    padding: 8px;
    border-radius: 4px;
    border: 1px solid #ccc;
    font-size: 1em;
  }
  #editForm button {
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1em;
  }
  #saveBtn {
    background-color: #4CAF50;
    color: white;
  }
  #cancelEdit {
    background-color: #f44336;
    color: white;
    margin-left: 10px;
  }
  /* Responsive adjustments */
  @media(max-width: 600px){
    body {
      padding: 10px;
    }
    h1 {
      font-size: 1.5em;
    }
    #currentTime {
      font-size: 1em;
    }
    #calendar {
      padding: 5px;
    }
    table {
      min-width: 100%;
    }
  }
</style>
</head>
<body>
<h1>Calendar with Schedule &amp; Edit</h1>
<a href="../../your%20favorite.html"><button id="exitBtn">Exit</button></a>
<div id="currentTime"></div>
<div id="controls" style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px;">
  <label for="monthSelect">Month:</label>
  <select id="monthSelect"></select>
  <label for="yearSelect">Year:</label>
  <select id="yearSelect"></select>
  <button id="generateBtn">Generate Calendar</button>
  <button id="todayBtn">Today</button>
</div>
<div id="calendar"></div>
<div id="schedule">
  <h2>Tasks, Events &amp; Appointments</h2>
  <ul id="scheduleList"></ul>
  <h3>Add New</h3>
  <form id="addTaskForm" aria-label="Add New Task">
    <label for="taskTitle">Title:</label>
    <input id="taskTitle" placeholder="Title" required type="text" />
    <label for="taskDetails">Details:</label>
    <textarea id="taskDetails" placeholder="Details" rows="3"></textarea>
    <label for="taskDate">Date:</label>
    <input id="taskDate" required type="date" />
    <label for="taskTime">Time:</label>
    <input id="taskTime" required type="time" />
    <button type="submit">Add</button>
  </form>
</div>
<!-- Overlay for editing -->
<div id="editOverlay" role="dialog" aria-modal="true" aria-labelledby="editDialogTitle" aria-describedby="editDialogDesc">
  <div id="editFormContainer">
    <h3 id="editDialogTitle">Edit Entry</h3>
    <form id="editForm" aria-label="Edit Schedule Entry">
      <label for="editTitle">Title:</label>
      <input id="editTitle" placeholder="Title" required type="text" />
      <label for="editDetails">Details:</label>
      <textarea id="editDetails" rows="3" required></textarea>
      <label for="editDate">Date:</label>
      <input id="editDate" required type="date" />
      <label for="editTime">Time:</label>
      <input id="editTime" required type="time" />
      <div style="margin-top:10px;">
        <button id="saveBtn" type="submit">Save</button>
        <button type="button" id="cancelEdit">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
  // JavaScript for Tasks, Events & Appointments Synchronization

  const monthSelect = document.getElementById('monthSelect');
  const yearSelect = document.getElementById('yearSelect');
  const generateBtn = document.getElementById('generateBtn');
  const currentTimeDiv = document.getElementById('currentTime');
  const scheduleList = document.getElementById('scheduleList');
  const addTaskForm = document.getElementById('addTaskForm');
  const taskTitleInput = document.getElementById('taskTitle');
  const taskDetailsInput = document.getElementById('taskDetails');
  const taskDateInput = document.getElementById('taskDate');
  const taskTimeInput = document.getElementById('taskTime');
  const calendarDiv = document.getElementById('calendar');
  const todayBtn = document.getElementById('todayBtn');
  const overlay = document.getElementById('editOverlay');
  const editForm = document.getElementById('editForm');
  const editTitle = document.getElementById('editTitle');
  const editDetails = document.getElementById('editDetails');
  const editDate = document.getElementById('editDate');
  const editTime = document.getElementById('editTime');
  const cancelEditBtn = document.getElementById('cancelEdit');

  const months = [
    'January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'
  ];

  let scheduleItems = []; // All tasks, events, appointments
  let currentEditIndex = null;

  // Populate month select options
  function populateMonths() {
    months.forEach((name, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = name;
      monthSelect.appendChild(option);
    });
  }

  // Populate year select options
  function populateYears() {
    const currentYear = new Date().getFullYear();
    for(let y = currentYear - 10; y <= currentYear + 10; y++) {
      const option = document.createElement('option');
      option.value = y;
      option.textContent = y;
      if(y === currentYear) option.selected = true;
      yearSelect.appendChild(option);
    }
  }

  // Generate calendar grid
  function generateCalendar() {
    const selectedMonth = parseInt(monthSelect.value);
    const selectedYear = parseInt(yearSelect.value);
    const today = new Date();

    const firstDay = new Date(selectedYear, selectedMonth, 1).getDay();
    const daysInMonth = new Date(selectedYear, selectedMonth + 1, 0).getDate();

    let html = '<table><thead><tr>';
    ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
      html += `<th>${day}</th>`;
    });
    html += '</tr></thead><tbody>';

    let date = 1;
    for(let week=0; week<6; week++) {
      html += '<tr>';
      for(let day=0; day<7; day++) {
        if((week===0 && day<firstDay) || date > daysInMonth){
          html += '<td></td>';
        } else {
          const isToday = selectedYear===today.getFullYear() && selectedMonth===today.getMonth() && date===today.getDate();
          const classes = isToday ? 'today' : '';
          const dateStr = `${selectedYear}-${String(selectedMonth+1).padStart(2,'0')}-${String(date).padStart(2,'0')}`;
          const itemsForDate = scheduleItems.filter(item => item.date === dateStr);
          const indicator = itemsForDate.length > 0 ? '<small style="color:red;">●</small>' : '';
          html += `<td class="${classes}"><div>${date}</div><div title="${itemsForDate.map(i=>i.title).join(', ')}">${indicator}</div></td>`;
          date++;
        }
      }
      html += '</tr>';
      if(date > daysInMonth) break;
    }
    html += '</tbody></table>';
    calendarDiv.innerHTML = html;
  }

  // Show current time
  function updateTime() {
    const now = new Date();
    currentTimeDiv.textContent = 'Current Time: ' + now.toLocaleString();
  }

  // Jump to today
  document.getElementById('todayBtn').addEventListener('click', () => {
    const today = new Date();
    monthSelect.value = today.getMonth();
    yearSelect.value = today.getFullYear();
    generateCalendar();
  });

  // Initialize
  populateMonths();
  populateYears();
  generateCalendar();
  updateTime();
  setInterval(updateTime, 1000);

  // Regenerate calendar on button click
  document.getElementById('generateBtn').addEventListener('click', generateCalendar);

  // Add new task/event/appointment
  addTaskForm.addEventListener('submit', e => {
    e.preventDefault();
    const title = taskTitleInput.value.trim();
    const details = taskDetailsInput.value.trim();
    const date = taskDateInput.value;
    const time = taskTimeInput.value;
    if(title && date && time){
      scheduleItems.push({title, details, date, time});
      addTaskForm.reset();
      generateCalendar();
      displaySchedule();
    }
  });

  // Display all schedule items
  function displaySchedule() {
    scheduleList.innerHTML = '';
    scheduleItems
      .slice()
      .sort((a,b)=>a.date.localeCompare(b.date) || a.time.localeCompare(b.time))
      .forEach((item, index) => {
        const hue = (item.title.charCodeAt(0) * 137) % 360;
        const color = `hsl(${hue},70%,50%)`;
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="task-info">
            <span class="circle" style="background-color:${color};"></span>
            <div>
              <strong>${item.title}</strong> (${item.date} ${item.time})<br/>
              ${item.details}
            </div>
          </div>
          <div class="actionBtns">
            <button data-index="${index}" class="editBtn">Edit</button>
            <button data-index="${index}" class="deleteBtn">Delete</button>
          </div>
        `;
        scheduleList.appendChild(li);
      });
  }

  // Edit or delete schedule items
  scheduleList.addEventListener('click', e => {
    const target = e.target;
    if(target.classList.contains('editBtn')){
      const index = parseInt(target.dataset.index);
      openEditDialog(index);
    } else if(target.classList.contains('deleteBtn')){
      const index = parseInt(target.dataset.index);
      scheduleItems.splice(index,1);
      displaySchedule();
      generateCalendar();
    }
  });

  // Open edit dialog
  function openEditDialog(index) {
    currentEditIndex = index;
    const item = scheduleItems[index];
    editTitle.value = item.title;
    editDetails.value = item.details;
    editDate.value = item.date;
    editTime.value = item.time;
    overlay.style.display = 'flex';
  }

  // Cancel editing
  document.getElementById('cancelEdit').addEventListener('click', () => {
    overlay.style.display = 'none';
  });

  // Save edited item
  document.getElementById('editForm').addEventListener('submit', e => {
    e.preventDefault();
    if(currentEditIndex !== null){
      scheduleItems[currentEditIndex] = {
        title: editTitle.value.trim(),
        details: editDetails.value.trim(),
        date: editDate.value,
        time: editTime.value
      };
      overlay.style.display = 'none';
      displaySchedule();
      generateCalendar();
    }
  });

  // Initialize display
  displaySchedule();
</script>
</body>
</html>
