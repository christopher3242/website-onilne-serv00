<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping List</title>
  <!-- Google Fonts for a modern, clean font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
    rel="stylesheet"
  />
  <style>
    /* Reset some default styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #ffffff);
      color: #333;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 30px;
      color: #4CAF50;
    }

    /* Style for links (Shop buttons) */
    .shop-link {
      display: inline-block;
      width: 100%;
      max-width: 350px;
      margin: 15px auto;
      font-size: 1.2em;
      color: #007BFF;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 8px;
      background-color: #ffffff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      text-align: center;
    }

    .shop-link:hover,
    .shop-link:focus {
      background-color: #4CAF50;
      color: #fff;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      outline: none;
    }

    /* Exit button styling */
    .exit-btn {
      display: inline-block;
      margin-top: 50px;
      padding: 14px 24px;
      font-size: 1em;
      color: #fff;
      background-color: #4CAF50;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .exit-btn:hover,
    .exit-btn:focus {
      background-color: #388E3C;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      outline: none;
    }

    /* Responsive adjustments */
    @media(max-width: 600px) {
      h1 {
        font-size: 2em;
      }
      .shop-link {
        font-size: 1em;
        padding: 12px 20px;
      }
      .exit-btn {
        padding: 12px 20px;
        font-size: 0.95em;
      }
    }
  </style>
</head>
<body>
  <main class="container" role="main" aria-label="Shopping List">
    <h1>Shopping List</h1>
    <!-- Shop links -->
    <a
      href="https://christopher-camilleri-shop.fourthwall.com/en-eur"
      target="_blank"
      rel="noopener noreferrer"
      class="shop-link"
    >
      Visit Shop to Fourthwall
    </a>
    <a
      href="https://my-store-c3b05b.creator-spring.com"
      target="_blank"
      rel="noopener noreferrer"
      class="shop-link"
    >
      Visit Shop to Teespring
    </a>
    <!-- Exit button -->
    <a
      href="../../your%20favorite.html"
      class="exit-btn"
      role="button"
    >
      Exit
    </a>
  </main>
</body>
</html>
