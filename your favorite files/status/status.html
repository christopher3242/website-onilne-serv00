<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Service Status</title>
<style>
  /* Reset and base styles */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* Container card */
  .container {
    background-color: #ffffff;
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    max-width: 500px;
    width: 100%;
    text-align: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  /* Hover effect for container */
  .container:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
  }

  h1 {
    margin-bottom: 25px;
    font-size: 2em;
    color: #222;
    font-weight: 700;
  }

  /* Buttons styling */
  a {
    display: inline-block;
    width: 100%;
    max-width: 350px;
    padding: 14px 20px;
    margin: 10px auto;
    font-size: 1.1em;
    border-radius: 8px;
    text-decoration: none;
    transition: background-color 0.3s, transform 0.2s;
  }

  /* Service status button styles */
  .status-link {
    background-color: #007bff;
    color: #fff;
  }
  .status-link:hover,
  .status-link:focus {
    background-color: #0056b3;
    outline: none;
    transform: translateY(-2px);
  }

  /* Exit button styles */
  .exit {
    background-color: #dc3545;
    color: #fff;
  }
  .exit:hover,
  .exit:focus {
    background-color: #a71d2a;
    outline: none;
    transform: translateY(-2px);
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Check Service Status</h1>
    <a 
      href="https://xxsexy.betteruptime.com/en" 
      class="status-link" 
      target="_blank" 
      rel="noopener noreferrer"
    >
      Visit Service Status Page
    </a>
    <br />
    <a 
      href="../../your%20favorite.html" 
      class="exit"
    >
      Exit
    </a>
  </div>
</body>
</html>
