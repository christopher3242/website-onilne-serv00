  <style>
    /* Reset some default styles for consistency */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #124592; /* Darker blue background */
      font-family: 'Arial Rounded MT', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: rgba(14, 26, 34, 0.8); /* semi-transparent blue */
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      max-width: 700px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      font-family: 'Arial Rounded MT', Arial, sans-serif;
      font-weight: bold;
      text-decoration: underline;
      margin-bottom: 25px;
      color: #2950ff; /* Light blue for contrast */
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 15px;
      margin-bottom: 40px;
    }

    td {
      padding: 15px;
      background-color: #0d7c9b; /* Blue shade for table cells */
      border-radius: 10px;
      transition: background-color 0.3s, transform 0.2s;
      word-wrap: break-word;
    }

    td:hover {
      background-color: #31276b; /* Slightly darker on hover */
      transform: translateY(-2px);
    }

    a {
      display: inline-block;
      padding: 8px 12px;
      color: #142430;
      text-decoration: none;
      font-size: 1.1em;
      transition: color 0.3s, text-decoration 0.3s;
    }

    a:hover {
      color: #a6d4fa;
      text-decoration: underline;
    }

    /* Style for the Exit button */
    .exit-link {
      display: inline-block;
      padding: 12px 24px;
      background-color: #19324e; /* Dark blue */
      color: #fff;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.2em;
      text-decoration: none;
      transition: background-color 0.3s, transform 0.2s;
    }

    .exit-link:hover {
      background-color: #0d47a1; /* Even darker blue on hover */
      transform: translateY(-2px);
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      h1 {
        font-size: 2em;
      }
      .exit-link {
        padding: 10px 20px;
        font-size: 1em;
      }
    }
  </style>
